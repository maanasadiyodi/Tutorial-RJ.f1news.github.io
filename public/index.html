<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gallery</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Views Management --- */
        .view { display: none; width: 100%; min-height: 100vh; animation: fadeIn 0.4s ease; }
        .view.active { display: flex; flex-direction: column; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Login View --- */
        #login-view {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 60%);
        }

        .login-card {
            background: var(--surface-dark);
            padding: 2.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 { margin-bottom: 0.5rem; font-size: 1.8rem; }
        .login-card p { color: var(--text-muted); margin-bottom: 2rem; }

        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { border-color: var(--text-main); color: var(--text-main); }

        /* --- Gallery View --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .insta-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; margin-left: 10px; transition: color 0.2s; }
        .insta-link:hover { color: var(--primary); }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; width: 100%; flex: 1; }

        .admin-panel {
            background: var(--surface-dark);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: none;
            animation: slideDown 0.3s ease;
        }
        .admin-panel.visible { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .btn-file { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        .progress-container { height: 4px; background: var(--bg-dark); border-radius: 2px; margin-top: 1rem; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--surface-dark);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            aspect-ratio: 1;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: var(--primary); }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
        }
        .card:hover .card-overlay { opacity: 1; }

        .card-actions { display: flex; justify-content: space-between; align-items: center; }
        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .action-btn:hover { background: var(--primary); }
        .action-btn.delete:hover { background: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }

        /* --- Lightbox --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.2s;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; box-shadow: var(--shadow); }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* --- Toast Notifications --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--surface-dark);
            border-left: 4px solid var(--primary);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border: 1px solid var(--border);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: #f59e0b; }

        @media (max-width: 600px) {
            header { padding: 1rem; }
            .container { padding: 1rem; }
            .upload-area { flex-direction: column; align-items: stretch; }
            .btn-file { text-align: center; }
        }
    </style>
</head>
<body>

    <!-- LOGIN VIEW -->
    <div id="login-view" class="view active">
        <div class="login-card">
            <h1>Welcome Back</h1>
            <p>Enter your password to access the gallery</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
                Hint: The password is <strong>124</strong>
            </p>
        </div>
    </div>

    <!-- GALLERY VIEW -->
    <div id="gallery-view" class="view">
        <header>
            <div style="display:flex; align-items:center;">
                <span class="logo">The Gallery</span>
                <a href="https://instagram.com/adichitodi" target="_blank" class="insta-link">@adichitodi</a>
            </div>
            <button id="logout-btn" class="btn btn-outline" style="width: auto; padding: 8px 16px;">Logout</button>
        </header>

        <div class="container">
            <!-- Admin Panel (Hidden if not logged in, but logic handles visibility) -->
            <div id="admin-panel" class="admin-panel">
                <h3 style="margin-bottom: 1rem;">Upload New Memories</h3>
                <div class="upload-area">
                    <div class="file-input-wrapper">
                        <button class="btn-file">📁 Choose Images</button>
                        <input type="file" id="file-input" accept="image/*" multiple>
                    </div>
                    <button id="upload-btn" class="btn btn-primary" style="width: auto;">Upload Now</button>
                </div>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <div id="gallery-grid" class="gallery-grid">
                <!-- Images injected here -->
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="Full view">
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // State
        const state = { isLoggedIn: false, isLoading: false };
        
        // Elements
        const views = {
            login: document.getElementById('login-view'),
            gallery: document.getElementById('gallery-view')
        };
        const els = {
            loginForm: document.getElementById('login-form'),
            passwordInput: document.getElementById('password'),
            logoutBtn: document.getElementById('logout-btn'),
            adminPanel: document.getElementById('admin-panel'),
            fileInput: document.getElementById('file-input'),
            uploadBtn: document.getElementById('upload-btn'),
            progressContainer: document.getElementById('progress-container'),
            progressBar: document.getElementById('progress-bar'),
            galleryGrid: document.getElementById('gallery-grid'),
            lightbox: document.getElementById('lightbox'),
            lightboxImg: document.getElementById('lightbox-img'),
            toastContainer: document.getElementById('toast-container')
        };

        // --- Navigation & Auth ---
        function switchView(viewName) {
            Object.values(views).forEach(el => el.classList.remove('active'));
            views[viewName].classList.add('active');
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth-status', { credentials: 'include' });
                const data = await res.json();
                state.isLoggedIn = data.isLoggedIn;
                if (state.isLoggedIn) {
                    switchView('gallery');
                    loadGallery();
                } else {
                    switchView('login');
                }
            } catch (e) {
                switchView('login');
            }
        }

        els.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = els.passwordInput.value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                    credentials: 'include'
                });
                const data = await res.json();
                
                if (data.success) {
                    state.isLoggedIn = true;
                    els.passwordInput.value = '';
                    showToast('Welcome back!', 'success');
                    switchView('gallery');
                    loadGallery();
                } else {
                    showToast('Incorrect password', 'error');
                    els.passwordInput.focus();
                }
            } catch (e) {
                showToast('Connection error', 'error');
            }
        });

        els.logoutBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                state.isLoggedIn = false;
                showToast('Logged out successfully', 'success');
                switchView('login');
            } catch (e) {
                showToast('Error logging out', 'error');
            }
        });

        // --- Gallery Logic ---
        async function loadGallery() {
            if (state.isLoading) return;
            state.isLoading = true;
            
            try {
                const res = await fetch('/images');
                const images = await res.json();
                
                els.galleryGrid.innerHTML = '';
                
                if (images.length === 0) {
                    els.galleryGrid.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <h3>No images yet</h3>
                            <p>Upload your first photo to get started!</p>
                        </div>
                    `;
                    return;
                }

                images.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openLightbox(img.url);
                    
                    card.innerHTML = `
                        <img src="${img.url}" alt="${img.name}" loading="lazy">
                        <div class="card-overlay">
                            <div class="card-actions">
                                <span style="font-size:0.8rem; opacity:0.8">${img.name}</span>
                                ${state.isLoggedIn ? `
                                    <button class="action-btn delete" onclick="event.stopPropagation(); deleteImage('${img.name}')">
                                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    els.galleryGrid.appendChild(card);
                });
            } catch (e) {
                showToast('Failed to load images', 'error');
            } finally {
                state.isLoading = false;
            }
        }

        async function deleteImage(filename) {
            if(!confirm('Are you sure you want to delete this image?')) return; // Simple confirm for safety, can be replaced with toast logic if preferred
            
            try {
                const res = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (res.ok) {
                    showToast('Image deleted', 'success');
                    loadGallery();
                } else {
                    showToast('Failed to delete', 'error');
                }
            } catch (e) {
                showToast('Error deleting image', 'error');
            }
        }

        // --- Upload Logic ---
        els.uploadBtn.addEventListener('click', async () => {
            const files = Array.from(els.fileInput.files);
            if (files.length === 0) {
                showToast('Please select images first', 'warning');
                return;
            }

            els.uploadBtn.disabled = true;
            els.progressContainer.style.display = 'block';
            els.progressBar.style.width = '0%';

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('image', files[i]);
                
                try {
                    await fetch('/upload', { method: 'POST', body: formData, credentials: 'include' });
                } catch (e) {
                    console.error('Upload error', e);
                }
                
                const percent = ((i + 1) / files.length) * 100;
                els.progressBar.style.width = `${percent}%`;
            }

            els.uploadBtn.disabled = false;
            els.progressContainer.style.display = 'none';
            els.fileInput.value = '';
            showToast(`Uploaded ${files.length} image(s)`, 'success');
            loadGallery();
        });

        // --- Lightbox ---
        function openLightbox(url) {
            els.lightboxImg.src = url;
            els.lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            els.lightbox.classList.remove('active');
            els.lightboxImg.src = '';
            document.body.style.overflow = '';
        }

        els.lightbox.addEventListener('click', (e) => {
            if (e.target === els.lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // --- Toast System ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '';
            if (type === 'success') icon = '✓';
            if (type === 'error') icon = '✕';
            if (type === 'warning') icon = '⚠';
            
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            
            els.toastContainer.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
