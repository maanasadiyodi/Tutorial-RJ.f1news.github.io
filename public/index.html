<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gallery</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .insta-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .insta-link:hover { color: var(--primary); }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--text-main); background: rgba(255,255,255,0.05); }

        /* --- Main Container --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; width: 100%; flex: 1; }

        /* --- Admin Panel --- */
        .admin-panel {
            background: var(--surface-dark);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: none;
            animation: slideDown 0.3s ease;
        }
        .admin-panel.visible { display: block; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .btn-file { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        .progress-container { height: 4px; background: var(--bg-dark); border-radius: 2px; margin-top: 1rem; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

        /* --- Gallery Grid (MASONRY LAYOUT) --- */
        .gallery-grid {
            column-count: 5; /* Default columns */
            column-gap: 1.5rem;
        }

        /* Responsive Columns */
        @media (max-width: 1200px) { .gallery-grid { column-count: 4; } }
        @media (max-width: 900px) { .gallery-grid { column-count: 3; } }
        @media (max-width: 600px) { .gallery-grid { column-count: 2; column-gap: 1rem; } }
        @media (max-width: 400px) { .gallery-grid { column-count: 1; } }

        .card {
            background: var(--surface-dark);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 1.5rem; /* Space between items vertically */
            break-inside: avoid; /* Prevents card from splitting across columns */
            cursor: pointer;
            width: 100%; /* Ensures it fills the column width */
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: var(--shadow); 
            border-color: var(--primary); 
        }

        .card img { 
            width: 100%; 
            height: auto; /* KEY CHANGE: Allows natural height */
            display: block; 
            transition: opacity 0.3s; 
        }
        
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
            pointer-events: none; /* Let clicks pass through to image unless hitting buttons */
        }
        .card:hover .card-overlay { opacity: 1; }

        .card-actions { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            pointer-events: auto; /* Re-enable clicks for buttons */
        }
        
        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }
        .action-btn:hover { background: var(--primary); }
        .action-btn.delete:hover { background: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
            width: 100%;
            grid-column: 1 / -1; /* Fallback if grid fails */
        }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }

        /* --- Lightbox --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.2s;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; box-shadow: var(--shadow); }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* --- Login Modal Overlay --- */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }
        .login-overlay.active { display: flex; }
        
        .login-card {
            background: var(--surface-dark);
            padding: 2.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .login-overlay.active .login-card { transform: scale(1); }

        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus { border-color: var(--primary); }

        /* --- Toast Notifications --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--surface-dark);
            border-left: 4px solid var(--primary);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border: 1px solid var(--border);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: #f59e0b; }

        @media (max-width: 600px) {
            header { padding: 1rem; }
            .container { padding: 1rem; }
            .upload-area { flex-direction: column; align-items: stretch; }
            .btn-file { text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <span class="logo">The Gallery</span>
            <a href="https://instagram.com/adichitodi" target="_blank" class="insta-link">@adichitodi</a>
        </div>
        <button id="auth-btn" class="btn btn-outline">Login</button>
    </header>

    <div class="container">
        <!-- Admin Panel -->
        <div id="admin-panel" class="admin-panel">
            <h3 style="margin-bottom: 1rem;">Upload New Memories</h3>
            <div class="upload-area">
                <div class="file-input-wrapper">
                    <button class="btn-file">📁 Choose Images</button>
                    <input type="file" id="file-input" accept="image/*" multiple>
                </div>
                <button id="upload-btn" class="btn btn-primary" style="width: auto;">Upload Now</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="gallery-grid">
            <div class="empty-state">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <h3>Loading gallery...</h3>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="Full view">
    </div>

    <!-- Login Modal -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-card">
            <h2 style="margin-bottom: 0.5rem;">Admin Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Enter password to upload or delete</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
            <button id="close-login" class="btn btn-outline" style="width: 100%; margin-top: 1rem; border: none;">Cancel</button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        const state = { isLoggedIn: false, isLoading: false };
        
        const els = {
            authBtn: document.getElementById('auth-btn'),
            adminPanel: document.getElementById('admin-panel'),
            fileInput: document.getElementById('file-input'),
            uploadBtn: document.getElementById('upload-btn'),
            progressContainer: document.getElementById('progress-container'),
            progressBar: document.getElementById('progress-bar'),
            galleryGrid: document.getElementById('gallery-grid'),
            lightbox: document.getElementById('lightbox'),
            lightboxImg: document.getElementById('lightbox-img'),
            toastContainer: document.getElementById('toast-container'),
            loginOverlay: document.getElementById('login-overlay'),
            loginForm: document.getElementById('login-form'),
            passwordInput: document.getElementById('password'),
            closeLoginBtn: document.getElementById('close-login')
        };

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth-status', { credentials: 'include' });
                const data = await res.json();
                state.isLoggedIn = data.isLoggedIn;
                updateUI();
            } catch (e) {
                state.isLoggedIn = false;
                updateUI();
            }
        }

        function updateUI() {
            if (state.isLoggedIn) {
                els.authBtn.textContent = 'Logout';
                els.authBtn.className = 'btn btn-danger';
                els.adminPanel.classList.add('visible');
            } else {
                els.authBtn.textContent = 'Login';
                els.authBtn.className = 'btn btn-outline';
                els.adminPanel.classList.remove('visible');
            }
            // Reload gallery to show/hide delete buttons
            if(!state.isLoading) loadGallery();
        }

        function toggleLoginModal(show) {
            if (show) {
                els.loginOverlay.classList.add('active');
                setTimeout(() => els.passwordInput.focus(), 100);
            } else {
                els.loginOverlay.classList.remove('active');
                els.passwordInput.value = '';
            }
        }

        els.authBtn.addEventListener('click', () => {
            if (state.isLoggedIn) {
                logout();
            } else {
                toggleLoginModal(true);
            }
        });

        els.closeLoginBtn.addEventListener('click', () => toggleLoginModal(false));
        els.loginOverlay.addEventListener('click', (e) => {
            if (e.target === els.loginOverlay) toggleLoginModal(false);
        });

        els.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = els.passwordInput.value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                    credentials: 'include'
                });
                const data = await res.json();
                
                if (data.success) {
                    state.isLoggedIn = true;
                    updateUI();
                    toggleLoginModal(false);
                    showToast('Access granted!', 'success');
                } else {
                    showToast('Incorrect password', 'error');
                }
            } catch (e) {
                showToast('Connection error', 'error');
            }
        });

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                state.isLoggedIn = false;
                updateUI();
                showToast('Logged out successfully', 'success');
            } catch (e) {
                showToast('Error logging out', 'error');
            }
        }

        async function loadGallery() {
            if (state.isLoading) return;
            state.isLoading = true;
            
            try {
                const res = await fetch('/images');
                const images = await res.json();
                
                els.galleryGrid.innerHTML = '';
                
                if (images.length === 0) {
                    els.galleryGrid.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <h3>No images yet</h3>
                            <p>${state.isLoggedIn ? 'Upload your first photo!' : 'Login to upload photos.'}</p>
                        </div>
                    `;
                    return;
                }

                images.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    // Clicking the card opens lightbox
                    card.onclick = (e) => {
                        // Prevent opening if clicking a button
                        if(e.target.closest('.action-btn')) return;
                        openLightbox(img.url);
                    };
                    
                    let deleteBtn = '';
                    if (state.isLoggedIn) {
                        deleteBtn = `
                            <button class="action-btn delete" title="Delete Image">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        `;
                        // Attach delete event directly to button to avoid bubbling issues
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = deleteBtn;
                        const btn = tempDiv.firstElementChild;
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            deleteImage(img.name);
                        };
                        deleteBtn = btn; // Replace string with element
                    }

                    const imgEl = document.createElement('img');
                    imgEl.src = img.url;
                    imgEl.alt = img.name;
                    imgEl.loading = 'lazy';

                    const overlay = document.createElement('div');
                    overlay.className = 'card-overlay';
                    
                    const actions = document.createElement('div');
                    actions.className = 'card-actions';
                    
                    const fileName = document.createElement('span');
                    fileName.style.fontSize = '0.8rem';
                    fileName.style.opacity = '0.8';
                    fileName.textContent = img.name;

                    actions.appendChild(fileName);
                    if (typeof deleteBtn === 'object') actions.appendChild(deleteBtn);
                    else actions.innerHTML += deleteBtn;

                    overlay.appendChild(actions);
                    card.appendChild(imgEl);
                    card.appendChild(overlay);
                    els.galleryGrid.appendChild(card);
                });
            } catch (e) {
                showToast('Failed to load images', 'error');
            } finally {
                state.isLoading = false;
            }
        }

        async function deleteImage(filename) {
            try {
                const res = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (res.ok) {
                    showToast('Image deleted', 'success');
                    loadGallery();
                } else {
                    showToast('Failed to delete', 'error');
                }
            } catch (e) {
                showToast('Error deleting image', 'error');
            }
        }

        els.uploadBtn.addEventListener('click', async () => {
            const files = Array.from(els.fileInput.files);
            if (files.length === 0) {
                showToast('Please select images first', 'warning');
                return;
            }

            els.uploadBtn.disabled = true;
            els.progressContainer.style.display = 'block';
            els.progressBar.style.width = '0%';

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('image', files[i]);
                
                try {
                    await fetch('/upload', { method: 'POST', body: formData, credentials: 'include' });
                } catch (e) {
                    console.error('Upload error', e);
                }
                
                const percent = ((i + 1) / files.length) * 100;
                els.progressBar.style.width = `${percent}%`;
            }

            els.uploadBtn.disabled = false;
            els.progressContainer.style.display = 'none';
            els.fileInput.value = '';
            showToast(`Uploaded ${files.length} image(s)`, 'success');
            loadGallery();
        });

        function openLightbox(url) {
            els.lightboxImg.src = url;
            els.lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            els.lightbox.classList.remove('active');
            els.lightboxImg.src = '';
            document.body.style.overflow = '';
        }

        els.lightbox.addEventListener('click', (e) => {
            if (e.target === els.lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '';
            if (type === 'success') icon = '✓';
            if (type === 'error') icon = '✕';
            if (type === 'warning') icon = '⚠';
            
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            
            els.toastContainer.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadGallery();
        });
    </script>
</body>
</html>
