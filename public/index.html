<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #35364e; --surface-color: rgba(40, 42, 60, 0.7); --border-color: rgba(60, 65, 90, 0.6);
            --text-primary: #f0f0f0; --text-secondary: #b0b3c5; --accent-gold: #c8534d; --selection-blue: #3b82f6;
            --radius-md: 4px; --radius-lg: 12px;
        }
        [data-theme="light"] {
            --bg-color: #f0f2f5; --surface-color: rgba(255, 255, 255, 0.8); --border-color: rgba(200, 200, 210, 0.6);
            --text-primary: #1f2328; --text-secondary: #656d76; --selection-blue: #2563eb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Noise Gradient Overlay */
        .ambient-bg { position: fixed; inset: 0; z-index: -2; background: var(--bg-color); }
        .gradient-blob { position: absolute; top: -10%; left: -10%; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(100px); opacity: 0.3; animation: float 25s infinite alternate; background: radial-gradient(circle, var(--accent-gold), transparent); }
        .blob-2 { bottom: -10%; right: -10%; left: auto; top: auto; background: radial-gradient(circle, #6c5ce7, transparent); animation-delay: -12s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
        
        /* App Container */
        .app-container { width: 100%; max-width: 100vw; display: flex; flex-direction: column; align-items: center; padding: 0; position: relative; z-index: 1; }
        
        /* Header */
        header { width: 100%; background: var(--bg-color); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; color: var(--text-primary); }
        .insta-link { color: var(--accent-gold); text-decoration: none; font-style: italic; }
        .controls { display: flex; gap: 1rem; align-items: center; }
        
        /* Bulk Actions */
        .bulk-actions { display: none; background: var(--surface-color); border: 1px solid var(--selection-blue); padding: 0.5rem 1rem; border-radius: var(--radius-md); margin-right: 1rem; }
        .bulk-actions.active { display: flex; align-items: center; gap: 10px; }
        .btn-delete-all { background: var(--selection-blue); color: white; border: none; padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; }
        .btn-delete-all.confirm-mode { background: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        /* Buttons & Switches */
        button { cursor: pointer; border: 1px solid transparent; border-radius: var(--radius-md); padding: 6px 14px; transition: 0.2s; font-family: inherit; font-size: 0.85rem; text-transform: uppercase; }
        .btn-login { background-color: var(--btn-bg); border-color: var(--btn-border); color: var(--text-primary); }
        .btn-login:hover { background-color: var(--surface-color); }
        .btn-primary { background-color: var(--accent-gold); color: white; border: none; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--border-color); transition: 0.2s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: 0.2s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-gold); }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* Admin Panel */
        .admin-panel { width: 100%; max-width: 700px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2rem; margin: 3rem auto; display: none; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .panel-header { text-align: center; margin-bottom: 1.5rem; }
        .upload-area { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        input[type="file"] { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 8px 14px; color: var(--text-primary); outline: none; }
        input[type="file"]:focus { border-color: var(--accent-gold); }
        .progress-container { width: 100%; height: 2px; background: var(--border-color); margin-top: 1.5rem; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--accent-gold); width: 0%; transition: width 0.3s; }
        
        /* Gallery Grid */
        .gallery-container { width: 100%; max-width: 100%; margin: 0; padding: 1rem; column-count: 5; column-gap: 2rem; }
        @media (max-width: 1200px) { .gallery-container { column-count: 4; } }
        @media (max-width: 900px) { .gallery-container { column-count: 3; } }
        @media (max-width: 600px) { .gallery-container { column-count: 2; } }
        @media (max-width: 400px) { .gallery-container { column-count: 1; } }

        .card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); overflow: hidden; break-inside: avoid; margin: 0 auto 2rem auto; cursor: zoom-in; }
        .card.selected { border: 3px solid var(--selection-blue); }
        .card img { width: 100%; height: auto; display: block; opacity: 0; transition: opacity 0.6s ease; }
        .card img.loaded { opacity: 1; }
        .card:hover { transform: translateY(-6px); }
        
        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; align-items: flex-end; justify-content: flex-end; padding: 1.5rem; opacity: 0; transition: opacity 0.3s; }
        .card:hover .overlay { opacity: 1; }
        .actions { display: flex; gap: 0.8rem; }
        .btn-action { background: var(--accent-gold); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: 0.2s; }
        .btn-action:hover { background: var(--accent-gold-hover); }
        .btn-delete { background: rgba(218, 54, 51, 0.9); display: none; }
        .btn-delete.confirm-mode { background: #ffffff; color: #dc2626; animation: pulse 1s infinite; }

        .checkbox-overlay { position: absolute; top: 10px; left: 10px; width: 32px; height: 32px; background: rgba(0,0,0,0.6); border: 2px solid var(--selection-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; z-index: 10; }
        .card:hover .checkbox-overlay, .card.selected .checkbox-overlay { opacity: 1; }
        .card.selected .checkbox-overlay { background: var(--selection-blue); }
        .checkbox-icon { color: white; display: none; }
        .card.selected .checkbox-icon { display: block; }

        /* Lightbox & Modal */
        .lightbox { position: fixed; inset: 0; background: rgba(10, 14, 23, 0.95); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .lightbox.active { display: flex; }
        .lightbox-content { max-width: 90%; max-height: 90vh; border: 1px solid var(--border-color); border-radius: var(--radius-lg); }
        .lightbox-close { position: absolute; top: 2rem; right: 2rem; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        
        .login-overlay { position: fixed; inset: 0; background: rgba(53, 54, 78, 0.8); backdrop-filter: blur(10px); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .login-modal { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 3rem 2.5rem; width: 90%; max-width: 400px; text-align: center; animation: slideUp 0.4s forwards; }
        .login-input { width: 100%; padding: 12px; margin: 1rem 0; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); outline: none; }
        .login-btn-submit { width: 100%; background: var(--accent-gold); color: white; border: none; padding: 12px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }
        .error-msg { color: #ef4444; margin-top: 1rem; opacity: 0; }
        
        /* Toast */
        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface-color); border: 1px solid var(--border-color); padding: 1rem 2rem; border-radius: var(--radius-lg); z-index: 3000; display: flex; align-items: center; gap: 1rem; opacity: 0; transition: all 0.5s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-secondary); font-style: italic; }
    </style>
</head>
<body>
    <!-- Removed External Resources -->
    <div class="ambient-bg"><div class="gradient-blob"></div><div class="gradient-blob blob-2"></div></div>

    <!-- Login Modal -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-modal">
            <h2>Admin Access</h2>
            <p style="color:var(--text-secondary)">Enter password</p>
            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="password" id="login-password" class="login-input" placeholder="Password" required autocomplete="off">
                <button type="submit" class="login-btn-submit">Unlock</button>
            </form>
            <div id="login-error" class="error-msg">Incorrect password</div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast">
        <i id="toast-icon" class="fas fa-info-circle"></i> 
        <span id="toast-message">Message</span>
    </div>

    <div class="app-container">
        <header>
            <div class="header-left">
                <h1>The Gallery</h1>
                <a href="https://instagram.com/adichitodi" target="_blank" class="insta-link">@adichitodi</a>
            </div>
            <div class="controls">
                <div id="bulk-actions" class="bulk-actions">
                    <span id="selected-count">0</span> selected
                    <button id="btn-delete-all" class="btn-delete-all" onclick="handleBulkDeleteClick()">Delete</button>
                </div>
                <label class="switch"><input type="checkbox" id="theme-toggle" onchange="toggleTheme()"><span class="slider"></span></label>
                <button id="login-btn" class="btn-login" onclick="attemptLogin()">🔒 Login</button>
            </div>
        </header>

        <div id="admin-panel" class="admin-panel">
            <div class="panel-header">
                <h2>Upload Memories</h2>
                <p>Select images to upload</p>
            </div>
            <div class="upload-area">
                <input type="file" id="fileInput" accept="image/*" multiple>
                <button class="btn-primary" onclick="startUpload()">Upload Now</button>
            </div>
            <div class="progress-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        </div>

        <div class="gallery-container" id="gallery-container">
            <div class="empty-state">No memories yet</div>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        let isLoggedIn = false;
        let selectedFiles = new Set();
        let deleteConfirmActive = false;

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-toggle').checked = savedTheme === 'light';
            checkAuthStatus();
            loadImages();
            showToast("Welcome", "info");
        });

        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        async function checkAuthStatus() {
            try {
                const res = await fetch('/api/auth-status');
                const data = await res.json();
                isLoggedIn = false; // Force logout on refresh
                updateUI();
            } catch (e) {
                isLoggedIn = false;
                updateUI();
            }
        }

        function attemptLogin() {
            if (isLoggedIn) { logout(); return; }
            document.getElementById('login-overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('login-password').focus(), 100);
        }

        function closeLoginModal() { document.getElementById('login-overlay').style.display = 'none'; }

        function handleLogin(e) {
            e.preventDefault();
            const pwd = document.getElementById('login-password').value;
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    isLoggedIn = true;
                    closeLoginModal();
                    updateUI();
                    showToast("Access Granted", "success");
                } else {
                    document.querySelector('.login-modal').classList.add('shake');
                    setTimeout(() => document.querySelector('.login-modal').classList.remove('shake'), 500);
                    showToast("Wrong Password", "error");
                }
            });
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            isLoggedIn = false;
            updateUI();
            showToast("Logged Out", "info");
        }

        function updateUI() {
            const btn = document.getElementById('login-btn');
            const panel = document.getElementById('admin-panel');
            const bulkBar = document.getElementById('bulk-actions');
            
            if (isLoggedIn) {
                btn.innerText = "🔓 Logout";
                btn.style.background = "var(--accent-gold)";
                btn.style.color = "white";
                panel.style.display = "block";
                bulkBar.classList.toggle('active', selectedFiles.size > 0);
            } else {
                btn.innerText = "🔒 Login";
                btn.style.background = "";
                btn.style.color = "";
                panel.style.display = "none";
                bulkBar.classList.remove('active');
                selectedFiles.clear();
                updateBulkActions();
            }
            loadImages();
        }

        async function loadImages() {
            const container = document.getElementById('gallery-container');
            try {
                const res = await fetch('/images');
                const images = await res.json();
                
                if (images.length === 0) {
                    container.innerHTML = '<div class="empty-state">No memories yet</div>';
                    return;
                }

                container.innerHTML = '';
                images.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    if (selectedFiles.has(img.name)) card.classList.add('selected');

                    const cb = document.createElement('div');
                    cb.className = 'checkbox-overlay';
                    cb.onclick = (e) => { e.stopPropagation(); toggleSelection(img.name, card); };
                    cb.innerHTML = '<i class="fas fa-check checkbox-icon"></i>';

                    const imgEl = document.createElement('img');
                    imgEl.src = img.url;
                    imgEl.onload = () => imgEl.classList.add('loaded');
                    imgEl.onclick = () => openLightbox(img.url);

                    const overlay = document.createElement('div');
                    overlay.className = 'overlay';
                    const actions = document.createElement('div');
                    actions.className = 'actions';

                    const dlBtn = document.createElement('button');
                    dlBtn.className = 'btn-action';
                    dlBtn.innerHTML = '<i class="fas fa-download"></i>';
                    dlBtn.onclick = (e) => { e.stopPropagation(); window.open(img.url, '_blank'); };

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-action btn-delete';
                    delBtn.innerHTML = '<i class="fas fa-trash"></i>';
                    
                    if (isLoggedIn) {
                        delBtn.style.display = 'block';
                        delBtn.onclick = (e) => { e.stopPropagation(); handleDeleteClick(img.name, delBtn); };
                        actions.appendChild(delBtn);
                    }

                    actions.appendChild(dlBtn);
                    overlay.appendChild(actions);
                    card.appendChild(cb);
                    card.appendChild(imgEl);
                    card.appendChild(overlay);
                    container.appendChild(card);
                });
            } catch (e) { console.error("Load failed", e); }
        }

        function toggleSelection(name, card) {
            if (selectedFiles.has(name)) {
                selectedFiles.delete(name);
                card.classList.remove('selected');
            } else {
                selectedFiles.add(name);
                card.classList.add('selected');
            }
            updateBulkActions();
        }

        function updateBulkActions() {
            document.getElementById('selected-count').innerText = selectedFiles.size;
            const btn = document.getElementById('btn-delete-all');
            
            if (isLoggedIn && selectedFiles.size > 0) {
                document.getElementById('bulk-actions').classList.add('active');
                deleteConfirmActive = false;
                btn.classList.remove('confirm-mode');
                btn.innerHTML = '<i class="fas fa-trash"></i> Delete';
            } else {
                document.getElementById('bulk-actions').classList.remove('active');
            }
        }

        function handleDeleteClick(filename, btnElement) {
            if (deleteConfirmActive) {
                deleteImage(filename);
                resetDeleteButtons();
            } else {
                deleteConfirmActive = true;
                btnElement.classList.add('confirm-mode');
                btnElement.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                showToast("Click again to confirm", "warning");
                setTimeout(() => { if(deleteConfirmActive) resetDeleteButtons(); }, 3000);
            }
        }

        function resetDeleteButtons() {
            deleteConfirmActive = false;
            document.querySelectorAll('.btn-delete').forEach(b => {
                b.classList.remove('confirm-mode');
                b.innerHTML = '<i class="fas fa-trash"></i>';
            });
        }

        function handleBulkDeleteClick() {
            if (deleteConfirmActive) {
                deleteSelected();
                deleteConfirmActive = false;
                resetDeleteButtons();
            } else {
                deleteConfirmActive = true;
                const btn = document.getElementById('btn-delete-all');
                btn.classList.add('confirm-mode');
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Sure?';
                showToast("Click again to delete all", "warning");
                setTimeout(() => { if(deleteConfirmActive) { resetDeleteButtons(); btn.innerHTML = '<i class="fas fa-trash"></i> Delete'; } }, 3000);
            }
        }

        async function startUpload() {
            const input = document.getElementById('fileInput');
            const files = Array.from(input.files);
            if (!files.length) return showToast("Select files first", "error");

            const bar = document.getElementById('progress-bar');
            const cont = document.getElementById('progress-container');

            cont.style.display = 'block';
            for (let i = 0; i < files.length; i++) {
                const fd = new FormData();
                fd.append('image', files[i]);
                await fetch('/upload', { method: 'POST', body: fd });
                bar.style.width = `${((i + 1) / files.length) * 100}%`;
            }
            cont.style.display = 'none';
            input.value = '';
            loadImages();
            showToast(`Uploaded ${files.length}`, "success");
        }

        async function deleteImage(filename) {
            try {
                const res = await fetch(`/delete/${filename}`, { method: 'DELETE' });
                if (res.ok) {
                    selectedFiles.delete(decodeURIComponent(filename));
                    updateBulkActions();
                    loadImages();
                    showToast("Deleted", "success");
                } else {
                    showToast("Failed to delete", "error");
                }
            } catch (e) { showToast("Error", "error"); }
        }

        async function deleteSelected() {
            let count = 0;
            for (const name of selectedFiles) {
                const res = await fetch(`/delete/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (res.ok) count++;
            }
            selectedFiles.clear();
            updateBulkActions();
            loadImages();
            showToast(`Deleted ${count}`, "success");
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
        document.getElementById('lightbox').onclick = (e) => { if(e.target===e.currentTarget) closeLightbox(); };

        function showToast(msg, type = "info") {
            const t = document.getElementById('toast-container');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-message');
            
            text.innerText = msg;
            
            if (type === "success") { icon.className = "fas fa-check-circle"; icon.style.color = "#238636"; }
            else if (type === "error") { icon.className = "fas fa-exclamation-circle"; icon.style.color = "#da3633"; }
            else if (type === "warning") { icon.className = "fas fa-exclamation-triangle"; icon.style.color = "#d97706"; }
            else { icon.className = "fas fa-info-circle"; icon.style.color = "var(--accent-gold)"; }
            
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
