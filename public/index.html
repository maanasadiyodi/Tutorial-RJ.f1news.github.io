<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gallery</title>
    <style>
        :root { --bg-color: #1a1a2e; --surface-color: #16213e; --border-color: #0f3460; --text-primary: #e94560; --text-secondary: #8d99ae; --accent: #e94560; --select-blue: #533483; }
        [data-theme="light"] { --bg-color: #f5f5f5; --surface-color: #ffffff; --border-color: #ddd; --text-primary: #333; --text-secondary: #666; --accent: #007bff; --select-blue: #6c757d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg-color); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        h1 { font-size: 24px; }
        .insta-link { color: var(--accent); text-decoration: none; margin-left: 10px; }
        
        .top-bar { display: flex; gap: 10px; align-items: center; }
        button { padding: 8px 16px; border: none; cursor: pointer; border-radius: 4px; }
        .btn-login { background: var(--surface-color); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-primary { background: var(--accent); color: white; }
        
        #admin-panel { background: var(--surface-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
        #admin-panel.visible { display: block; }
        input[type="file"] { padding: 10px; margin-right: 10px; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { position: relative; border-radius: 8px; overflow: hidden; background: var(--surface-color); border: 1px solid var(--border-color); }
        .card img { width: 100%; height: auto; display: block; }
        .card.selected { border: 3px solid var(--select-blue); }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; display: none; }
        .card:hover .delete-btn { display: block; }
        .checkbox { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; }
        .checkbox.checked { background: var(--accent); }
        
        #upload-progress { height: 5px; background: var(--border-color); margin-top: 10px; display: none; }
        #upload-bar { height: 100%; background: var(--accent); width: 0%; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface-color); padding: 10px 20px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
        
        .empty { text-align: center; padding: 50px; color: var(--text-secondary); }
        
        @media (max-width: 600px) {
            header { flex-direction: column; gap: 10px; }
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Gallery <a href="https://instagram.com/adichitodi" target="_blank" class="insta-link">@adichitodi</a></h1>
            <div class="top-bar">
                <button id="login-btn" class="btn-login">Login</button>
            </div>
        </header>

        <div id="admin-panel">
            <h2>Upload Images</h2>
            <p style="color:var(--text-secondary); margin: 10px 0;">Select images to add to gallery</p>
            <input type="file" id="file-input" accept="image/*" multiple>
            <button id="upload-btn" class="btn-primary">Upload</button>
            <div id="upload-progress"><div id="upload-bar"></div></div>
        </div>

        <div id="toast" class="toast"></div>

        <div id="gallery" class="gallery">
            <div class="empty">No images yet. Login to upload!</div>
        </div>
    </div>

    <script>
        const state = { isLoggedIn: false, selectedImages: [], isLoading: false };
        const els = {
            loginBtn: document.getElementById('login-btn'),
            adminPanel: document.getElementById('admin-panel'),
            fileInput: document.getElementById('file-input'),
            uploadBtn: document.getElementById('upload-btn'),
            uploadProgress: document.getElementById('upload-progress'),
            uploadBar: document.getElementById('upload-bar'),
            gallery: document.getElementById('gallery'),
            toast: document.getElementById('toast')
        };

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth-status', { credentials: 'include' });
                const data = await res.json();
                state.isLoggedIn = data.isLoggedIn;
                updateUI();
            } catch (e) { showToast('Connection error', 'error'); }
        }

        function updateUI() {
            if (state.isLoggedIn) {
                els.loginBtn.textContent = 'Logout';
                els.loginBtn.classList.add('btn-primary');
                els.loginBtn.classList.remove('btn-login');
                els.adminPanel.classList.add('visible');
            } else {
                els.loginBtn.textContent = 'Login';
                els.loginBtn.classList.remove('btn-primary');
                els.loginBtn.classList.add('btn-login');
                els.adminPanel.classList.remove('visible');
            }
            if (!state.isLoading) loadImageList();
        }

        els.loginBtn.addEventListener('click', () => {
            if (state.isLoggedIn) {
                logout();
            } else {
                const password = prompt('Enter password:');
                if (!password) return;
                loginUser(password);
            }
        });

        async function loginUser(password) {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    state.isLoggedIn = true;
                    updateUI();
                    showToast('Logged in successfully!', 'success');
                } else {
                    showToast('Invalid password', 'error');
                }
            } catch (e) { showToast('Connection error', 'error'); }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                state.isLoggedIn = false;
                state.selectedImages = [];
                updateUI();
                showToast('Logged out', 'info');
            } catch (e) { showToast('Error', 'error'); }
        }

        async function loadImageList() {
            if (state.isLoading) return;
            state.isLoading = true;
            
            try {
                const res = await fetch('/images', { credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load');
                const images = await res.json();
                
                els.gallery.innerHTML = '';
                
                if (images.length === 0) {
                    els.gallery.innerHTML = '<div class="empty">No images yet. Login to upload!</div>';
                    return;
                }

                images.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card' + (state.selectedImages.includes(img.name) ? ' selected' : '');
                    
                    const checkbox = document.createElement('div');
                    checkbox.className = 'checkbox' + (state.selectedImages.includes(img.name) ? ' checked' : '');
                    checkbox.style.pointerEvents = 'auto';
                    checkbox.addEventListener('click', () => toggleSelection(img.name));
                    
                    const imgEl = document.createElement('img');
                    imgEl.src = img.url;
                    imgEl.alt = img.name;
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '×';
                    delBtn.onclick = () => deleteImage(img.name);
                    
                    card.appendChild(checkbox);
                    card.appendChild(imgEl);
                    card.appendChild(delBtn);
                    card.ondblclick = () => window.open(img.url, '_blank');
                    card.onclick = (e) => {
                        if (e.target !== checkbox && e.target !== delBtn) {
                            window.open(img.url, '_blank');
                        }
                    };
                    
                    els.gallery.appendChild(card);
                });
                
                showToast(`Loaded ${images.length} image(s)`, 'info');
            } catch (e) {
                els.gallery.innerHTML = '<div class="empty">Failed to load images. Please refresh.</div>';
                showToast('Could not load gallery', 'error');
            } finally {
                state.isLoading = false;
            }
        }

        function toggleSelection(name) {
            if (state.selectedImages.includes(name)) {
                state.selectedImages = state.selectedImages.filter(n => n !== name);
            } else {
                state.selectedImages.push(name);
            }
            loadImageList();
        }

        async function deleteImage(filename) {
            try {
                const res = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (res.ok) {
                    state.selectedImages = state.selectedImages.filter(n => n !== filename);
                    loadImageList();
                    showToast('Deleted successfully', 'success');
                } else {
                    showToast('Delete failed', 'error');
                }
            } catch (e) { showToast('Delete error', 'error'); }
        }

        els.uploadBtn.addEventListener('click', async () => {
            const files = Array.from(els.fileInput.files);
            if (files.length === 0) return showToast('Please select files first', 'warning');

            els.uploadBtn.disabled = true;
            els.uploadProgress.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('image', files[i]);
                
                try {
                    const res = await fetch('/upload', { method: 'POST', body: formData, credentials: 'include' });
                    if (!res.ok) throw new Error('Upload failed');
                } catch (e) {
                    console.error('Upload error:', e);
                    break;
                }
                
                els.uploadBar.style.width = `${((i + 1) / files.length) * 100}%`;
            }

            els.uploadBtn.disabled = false;
            els.uploadProgress.style.display = 'none';
            els.uploadBar.style.width = '0%';
            els.fileInput.value = '';
            loadImageList();
            showToast(`Uploaded ${files.length} image(s)!`, 'success');
        });

        function showToast(message, type = 'info') {
            els.toast.textContent = message;
            els.toast.style.backgroundColor = 
                type === 'error' ? '#dc3545' : 
                type === 'success' ? '#28a745' : 
                type === 'warning' ? '#ffc107' : getComputedStyle(document.documentElement).getPropertyValue('--surface-color');
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setInterval(loadImageList, 30000); // Auto-refresh every 30s
        });
    </script>
</body>
</html>
