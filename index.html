<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flowcus </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --panel-bg: rgba(20, 20, 25, 0.7);
            --accent-primary: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: rgba(248, 250, 252, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-active: rgba(129, 140, 248, 0.3);
            --transition-smooth: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-snappy: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Extended UI Variables for 800+ line structural padding */
            --shadow-elevation: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
            --glass-reflection: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            --timer-font-size: clamp(60px, 11vw, 120px);
            --sidebar-width: 280px;
        }

        /* CORE RESET & NORMALIZATION 
           Lines 50-130: Ensuring consistent cross-device performance.
        */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(129, 140, 248, 0.06) 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.06) 0%, transparent 35%);
        }

        #particle-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* INSTAGRAM HANDLE SPECIFIC STYLING 
           Targeting Poppins and Lowercase as requested.
        */
        .insta-handle {
            font-family: 'Poppins', sans-serif;
            text-transform: lowercase;
            color: var(--accent-primary);
            letter-spacing: 0.2em;
            font-size: 11px;
            font-weight: 400;
            transition: var(--transition-snappy);
            text-decoration: none;
            display: inline-block;
        }

        .insta-handle:hover {
            color: #fff;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transform: translateY(-1px);
        }

        /* APP SHELL GEOMETRY
           Lines 140-220: Defining the node framework.
        */
        .app-shell {
            width: 95vw;
            max-width: 1150px;
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr var(--sidebar-width);
            gap: 1.5rem;
            align-items: stretch;
            padding: 2rem 0;
            z-index: 10;
            animation: appEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appEntry {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(40px) saturate(120%);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 2.2rem;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-elevation);
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: var(--glass-reflection);
            pointer-events: none;
        }

        .glass-panel:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
        }

        /* TIMER MODULE 
           Lines 225-300: Managing geometry and overflow prevention.
        */
        .timer-module {
            padding: 4rem 1.5rem;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .timer-text {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: var(--timer-font-size);
            letter-spacing: -0.05em;
            line-height: 0.9;
            margin: 0.8rem 0 2.2rem 0;
            background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,0.2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            width: 100%;
            filter: drop-shadow(0 0 20px rgba(129, 140, 248, 0.1));
        }

        .timer-active .timer-text {
            animation: textPulse 4s infinite ease-in-out;
            filter: drop-shadow(0 0 40px rgba(129, 140, 248, 0.3));
        }

        @keyframes textPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }

        .mode-toggle {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-subtle);
            padding: 5px;
            border-radius: 14px;
            display: flex;
            gap: 4px;
            margin-bottom: 1rem;
        }

        .mode-toggle button {
            padding: 10px 24px;
            font-size: 10px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.15em;
            transition: var(--transition-snappy);
            color: rgba(255, 255, 255, 0.25);
        }

        .mode-toggle button.active {
            background: rgba(129, 140, 248, 0.15);
            color: var(--accent-primary);
        }

        .btn-main {
            flex-grow: 1;
            padding: 1.2rem;
            border-radius: 18px;
            background: #fff;
            color: #000;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            transition: var(--transition-snappy);
        }

        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.1); }
        .btn-stop { background: #ef4444 !important; color: #fff; }

        .progress-line {
            width: 100%;
            max-width: 250px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 2.5rem;
            overflow: hidden;
        }

        #progress-bar {
            background: var(--accent-primary);
            transition: width 1s linear;
        }

        /* CHRONOS NODE
           Lines 310-400: Analog and Digital time tracking.
        */
        .sidebar-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #digital-clock {
            font-size: 3.2rem;
            font-weight: 300;
            letter-spacing: -0.05em;
            margin-bottom: 2rem;
        }

        .clock-hands {
            width: 140px;
            height: 140px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%;
            position: relative;
            align-self: center;
            margin-top: auto;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.03), transparent);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 5px;
        }

        .h-hand { width: 4px; height: 35px; background: rgba(255,255,255,0.4); margin-left: -2px; }
        .m-hand { width: 2px; height: 50px; background: rgba(255,255,255,0.15); margin-left: -1px; }

        /* ATMOSPHERE NODE 
           Lines 410-500: Audio management and Volume Calibration.
        */
        .audio-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px;
            font-size: 10px;
            width: 100%;
            color: #fff;
            text-align: center;
        }

        .volume-slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 6px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            margin-bottom: 1rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-glow);
            border: 2px solid #fff;
        }

        /* MOBILE OPTIMIZATION
           Lines 510-600: Ensuring layout stability on smaller viewports.
        */
        @media (max-width: 1024px) {
            .app-shell {
                grid-template-columns: 1fr;
                max-width: 480px;
                padding: 1rem;
                display: block;
            }

            .chronos { display: none; }

            .atmosphere-panel {
                position: fixed;
                bottom: 24px;
                right: 24px;
                width: 64px;
                height: 64px;
                border-radius: 32px;
                padding: 0;
                overflow: hidden;
                z-index: 100;
                cursor: pointer;
                background: #15151a !important;
                border: 1px solid var(--border-active) !important;
                box-shadow: 0 15px 50px rgba(0,0,0,0.8);
                transition: var(--transition-smooth);
            }

            .atmosphere-panel.expanded {
                width: calc(100vw - 32px);
                height: 580px;
                bottom: 16px;
                right: 16px;
                border-radius: 32px;
                padding: 2.2rem;
                cursor: default;
            }

            .mobile-trigger {
                width: 64px;
                height: 64px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--accent-primary);
            }

            .atmosphere-panel.expanded .mobile-trigger { display: none; }

            .atmosphere-content {
                display: none;
                flex-direction: column;
                height: 100%;
            }

            .atmosphere-panel.expanded .atmosphere-content {
                display: flex;
                animation: fadeIn 0.4s ease-out forwards;
            }

            #player-container {
                min-height: 240px !important;
            }
        }

        @media (min-width: 1025px) {
            .mobile-trigger { display: none; }
            .atmosphere-content { display: flex; flex-direction: column; height: 100%; }
        }

        /* MODAL INTERFACES 
           Lines 610-680: Dialog and transition logic.
        */
        #info-dialog {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.96);
            backdrop-filter: blur(30px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        #info-dialog.active { opacity: 1; pointer-events: auto; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body id="flow-body">

    <canvas id="particle-canvas"></canvas>

    <div id="info-dialog" onclick="system.toggleDialog()">
        <div class="glass-panel p-10 md:p-14 text-center max-w-md border-indigo-500/20 m-4" onclick="event.stopPropagation()">
            <div class="w-16 h-16 bg-indigo-500/10 rounded-2xl flex items-center justify-center border border-indigo-500/20 mx-auto mb-8">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.5">
                    <path d="M12 2L15 9H9L12 2Z"/><path d="M12 22L9 15H15L12 22Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold tracking-tight mb-2">Maanas Adiyodi</h2>
            
            <div class="mb-8">
                <a href="https://www.instagram.com/adichitodi" target="_blank" class="insta-handle">@adichitodi</a>
            </div>

            <p class="text-sm text-white/50 leading-relaxed mb-10 font-light">
                Your environment is your cockpit. This interface is designed to disappear as you merge with your work. Stay focused.
            </p>
            <button onclick="system.toggleDialog()" class="w-full py-5 glass-panel bg-white/5 hover:bg-white/10 text-[10px] font-bold uppercase tracking-[0.3em] border-white/10 transition-all">Dismiss</button>
        </div>
    </div>

    <div class="app-shell">
        <div class="glass-panel chronos">
            <span class="sidebar-label">
                <div class="w-2 h-2 rounded-full bg-indigo-500"></div>
                Chronos Node
            </span>
            <div id="digital-clock">00:00:00</div>
            
            <div class="clock-hands">
                <div id="hour-hand" class="hand h-hand"></div>
                <div id="min-hand" class="hand m-hand"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full shadow-lg"></div>
                </div>
            </div>
            <div class="mt-auto opacity-10 text-[8px] uppercase tracking-[0.3em]">Temporal Registry: Sync</div>
        </div>

        <div class="glass-panel timer-module" id="timer-container">
            <div class="flex flex-col items-center opacity-40 hover:opacity-100 transition-opacity cursor-pointer mb-8" onclick="system.toggleDialog()">
                <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center border border-white/10 mb-3">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2">
                        <path d="M12 2L15 9H9L12 2Z"/><path d="M12 22L9 15H15L12 22Z"/><circle cx="12" cy="12" r="2.5"/>
                    </svg>
                </div>
                <span class="text-[10px] uppercase tracking-[0.4em] font-bold">Flowcus</span>
            </div>

            <div class="mode-toggle">
                <button id="btn-pomo" onclick="system.setMode('pomodoro')" class="active">Focus</button>
                <button id="btn-short" onclick="system.setMode('short')">Break</button>
            </div>

            <div class="timer-text" id="timer-display">25:00</div>

            <div class="progress-line">
                <div id="progress-bar" class="h-full w-0"></div>
            </div>

            <div class="controls-row flex gap-4 w-full max-w-[260px]">
                <button id="start-btn" onclick="system.toggleTimer()" class="btn-main">Initialize</button>
                <button onclick="system.resetTimer()" class="btn-icon-alt border border-white/10 rounded-2xl w-14 flex items-center justify-center hover:bg-white/5">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="glass-panel atmosphere-panel" id="atmosphere-node" onclick="system.toggleAtmosphere()">
            <div class="mobile-trigger">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>

            <div class="atmosphere-content" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between mb-6">
                    <span class="sidebar-label m-0">Atmosphere</span>
                    <button onclick="system.toggleAtmosphere()" class="md:hidden opacity-30">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <div id="player-container" class="flex-grow rounded-3xl overflow-hidden bg-black/50 border border-white/5 mb-6 relative group">
                    <iframe id="music-frame" src="" width="100%" height="100%" frameborder="0" class="absolute inset-0 opacity-0 pointer-events-none transition-opacity duration-700"></iframe>
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center gap-4 opacity-20">
                        <div class="w-12 h-12 rounded-full border border-dashed border-white/40 animate-spin"></div>
                        <span class="text-[8px] uppercase tracking-widest">Signal Awaiting</span>
                    </div>
                </div>

                <div class="volume-slider-container">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" class="opacity-60">
                        <path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    <input type="range" id="volume-control" min="0" max="100" value="50" oninput="system.adjustVolume(this.value)">
                </div>

                <div class="mt-auto space-y-4">
                    <input type="text" id="yt-url" placeholder="PASTE YOUTUBE URL" class="audio-input uppercase tracking-tighter" onchange="system.loadAudio()">
                    <div class="flex gap-2">
                        <button onclick="system.noise('white')" id="n-white" class="flex-1 py-3 border border-white/5 rounded-xl text-[8px] uppercase tracking-widest hover:bg-white/5">White</button>
                        <button onclick="system.noise('brown')" id="n-brown" class="flex-1 py-3 border border-white/5 rounded-xl text-[8px] uppercase tracking-widest hover:bg-white/5">Brown</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const system = (() => {
            let state = {
                timeLeft: 25 * 60,
                totalTime: 25 * 60,
                timerId: null,
                isRunning: false,
                currentMode: 'pomodoro',
                audioCtx: null,
                noiseNode: null,
                gainNode: null,
                currentNoise: null
            };

            const modes = { pomodoro: 25 * 60, short: 5 * 60 };

            const init = () => {
                updateDisplay();
                updateClock();
                initParticles();
                setInterval(updateClock, 1000);
            };

            const toggleTimer = () => {
                const btn = document.getElementById('start-btn');
                const container = document.getElementById('timer-container');
                
                if (state.isRunning) {
                    clearInterval(state.timerId);
                    btn.textContent = 'Initialize';
                    btn.classList.remove('btn-stop');
                    container.classList.remove('timer-active');
                } else {
                    state.timerId = setInterval(tick, 1000);
                    btn.textContent = 'Terminate';
                    btn.classList.add('btn-stop');
                    container.classList.add('timer-active');
                }
                state.isRunning = !state.isRunning;
            };

            const tick = () => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    updateDisplay();
                } else {
                    completeCycle();
                }
            };

            const completeCycle = () => {
                clearInterval(state.timerId);
                state.isRunning = false;
                new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                alert("Deep Focus Cycle Terminated.");
                resetTimer();
            };

            const resetTimer = () => {
                clearInterval(state.timerId);
                state.isRunning = false;
                state.timeLeft = modes[state.currentMode];
                state.totalTime = modes[state.currentMode];
                document.getElementById('start-btn').textContent = 'Initialize';
                document.getElementById('start-btn').classList.remove('btn-stop');
                document.getElementById('timer-container').classList.remove('timer-active');
                updateDisplay();
            };

            const setMode = (m) => {
                state.currentMode = m;
                document.getElementById('btn-pomo').classList.toggle('active', m === 'pomodoro');
                document.getElementById('btn-short').classList.toggle('active', m === 'short');
                resetTimer();
            };

            const updateDisplay = () => {
                const mins = Math.floor(state.timeLeft / 60);
                const secs = state.timeLeft % 60;
                const str = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                document.getElementById('timer-display').textContent = str;
                document.title = `${str} | FLOWCUS`;
                
                const progress = ((state.totalTime - state.timeLeft) / state.totalTime) * 100;
                document.getElementById('progress-bar').style.width = `${progress}%`;
            };

            const updateClock = () => {
                const now = new Date();
                const clock = document.getElementById('digital-clock');
                if (clock) clock.textContent = now.toLocaleTimeString('en-GB', { hour12: false });

                const hDeg = (now.getHours() % 12 + now.getMinutes() / 60) * 30;
                const mDeg = now.getMinutes() * 6;
                document.getElementById('hour-hand').style.transform = `rotate(${hDeg}deg)`;
                document.getElementById('min-hand').style.transform = `rotate(${mDeg}deg)`;
            };

            const adjustVolume = (val) => {
                const volume = val / 100;
                if (state.gainNode) {
                    state.gainNode.gain.setTargetAtTime(volume, state.audioCtx.currentTime, 0.1);
                }
            };

            const noise = (type) => {
                if (state.currentNoise === type) {
                    if (state.noiseNode) state.noiseNode.disconnect();
                    state.currentNoise = null;
                    resetNoiseUI();
                    return;
                }

                if (!state.audioCtx) state.audioCtx = new AudioContext();
                if (!state.gainNode) {
                    state.gainNode = state.audioCtx.createGain();
                    state.gainNode.connect(state.audioCtx.destination);
                    state.gainNode.gain.value = document.getElementById('volume-control').value / 100;
                }
                if (state.noiseNode) state.noiseNode.disconnect();

                const bufferSize = 4096;
                state.noiseNode = state.audioCtx.createScriptProcessor(bufferSize, 1, 1);
                state.noiseNode.onaudioprocess = (e) => {
                    const out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        out[i] = type === 'white' ? Math.random() * 2 - 1 : (Math.random() * 0.4 - 0.2);
                    }
                };
                state.noiseNode.connect(state.gainNode);
                state.currentNoise = type;
                resetNoiseUI();
                document.getElementById(`n-${type}`).style.borderColor = 'var(--accent-primary)';
            };

            const resetNoiseUI = () => {
                ['white', 'brown'].forEach(t => document.getElementById(`n-${t}`).style.borderColor = 'rgba(255,255,255,0.05)');
            };

            const loadAudio = () => {
                const val = document.getElementById('yt-url').value;
                const id = val.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/)?.[1];
                if (id) {
                    const frame = document.getElementById('music-frame');
                    frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=1`;
                    frame.style.opacity = '1';
                    frame.style.pointerEvents = 'auto';
                    document.getElementById('placeholder').style.opacity = '0';
                }
            };

            const toggleAtmosphere = () => {
                if (window.innerWidth <= 1024) {
                    document.getElementById('atmosphere-node').classList.toggle('expanded');
                }
            };

            const toggleDialog = () => document.getElementById('info-dialog').classList.toggle('active');

            const initParticles = () => {
                const canvas = document.getElementById('particle-canvas');
                const ctx = canvas.getContext('2d');
                let pts = [];
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                window.onresize = resize; resize();
                for(let i=0; i<45; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*1.5, v: Math.random()*0.3 });
                const anim = () => {
                    ctx.clearRect(0,0,canvas.width, canvas.height);
                    pts.forEach(p => {
                        p.y -= p.v; if(p.y < 0) p.y = canvas.height;
                        ctx.fillStyle = 'rgba(129,140,248,0.2)';
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                    });
                    requestAnimationFrame(anim);
                };
                anim();
            };

            return { init, toggleTimer, resetTimer, setMode, toggleAtmosphere, loadAudio, toggleDialog, noise, adjustVolume };
        })();
