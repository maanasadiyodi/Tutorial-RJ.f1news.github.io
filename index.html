<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flowcus · Deep Focus</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        /* ── TOKENS ──────────────────────────────────────────── */
        :root {
            --bg:       #0d0d10;
            --surface:  #111116;
            --surface2: #18181e;
            --surface3: #1e1e26;
            --border:   rgba(255,255,255,0.06);
            --border2:  rgba(255,255,255,0.10);
            --text:     #f0f0f8;
            --text2:    #b0afc8;
            --text3:    #7a7896;
            --ring:     #7c6fff;
            --accent:   #7c6fff;
            --danger:   #e05c6a;
            --live:     #e05c6a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
            --r-sm: 10px;
            --r-md: 16px;
            --r-lg: 22px;
            --r-xl: 28px;
        }

        body.light {
            --bg:       #f4f3fa;
            --surface:  #ffffff;
            --surface2: #eeecf8;
            --surface3: #e5e2f4;
            --border:   rgba(124,111,255,0.10);
            --border2:  rgba(124,111,255,0.18);
            --text:     #0e0d1a;
            --text2:    #2e2c4a;
            --text3:    #6560a0;
            --shadow-sm: 0 1px 3px rgba(124,111,255,0.08);
            --shadow-md: 0 4px 20px rgba(124,111,255,0.12);
        }

        body {
            font-family: 'Geist', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.4s ease, color 0.3s ease;
            position: relative;
        }

        /* ── GRID BACKGROUND — replaces blob soup ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            transition: opacity 0.4s ease;
        }
        body.light .bg-grid {
            background-image:
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
        }
        /* Single soft radial — just one, centered, subtle */
        .bg-glow {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(124,111,255,0.07) 0%, transparent 70%);
            transition: opacity 0.4s ease;
        }
        body.light .bg-glow {
            background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(124,111,255,0.06) 0%, transparent 70%);
        }

        /* ── LAYOUT ─────────────────────────────────────────── */
        .shell {
            position: relative; z-index: 10;
            width: 100%; max-width: 1080px;
            min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 32px 24px; gap: 14px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .side {
            width: 224px; min-width: 224px; height: 480px;
            display: flex; flex-direction: column;
            transition: width 0.55s cubic-bezier(0.4,0,0.2,1), min-width 0.55s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
        }
        .center {
            flex: 1; height: 572px; max-width: 400px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 26px 22px;
        }

        body.deep-focus .side { width: 0; min-width: 0; opacity: 0; pointer-events: none; }

        /* ── TYPOGRAPHY SYSTEM ──────────────────────────────── */
        .mono { font-family: 'DM Mono', monospace; }
        .serif { font-family: 'Instrument Serif', serif; }

        .label {
            font-family: 'DM Mono', monospace;
            font-size: 8.5px; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--text3);
            padding: 16px 18px 11px;
            border-bottom: 1px solid var(--border);
        }

        /* ── HEADER CONTROLS ────────────────────────────────── */
        .top-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }

        .seg {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 3px;
            display: flex; gap: 2px;
        }
        .seg-btn {
            padding: 6px 16px; border-radius: 8px;
            font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 500;
            color: var(--text2); background: transparent; border: none; cursor: pointer;
            transition: all 0.2s ease; letter-spacing: 0.03em;
        }
        .seg-btn.active { background: var(--surface3); color: var(--text); }

        .focus-pill {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 12px; border-radius: 100px;
            background: transparent;
            border: 1px solid var(--border2);
            font-family: 'DM Mono', monospace;
            font-size: 9.5px; font-weight: 400;
            color: var(--text2); cursor: pointer;
            transition: all 0.25s ease; letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .focus-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); transition: all 0.25s ease; }
        .focus-pill:hover { border-color: var(--border2); color: var(--text); }
        .focus-pill.active { border-color: var(--ring); background: rgba(124,111,255,0.08); color: var(--text); }
        .focus-pill.active .dot { background: var(--ring); }

        /* ── TIMER RING ─────────────────────────────────────── */
        .ring-wrap { position: relative; width: 252px; height: 252px; flex-shrink: 0; }
        .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring-track { fill: none; stroke: var(--surface3); stroke-width: 2; }
        .ring-bar {
            fill: none; stroke: var(--ring); stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 816.81; stroke-dashoffset: 816.81;
            /* No glow filter — clean line */
            transition: stroke-dashoffset 0.9s cubic-bezier(0.4,0,0.2,1), stroke 0.35s ease;
        }
        .ring-inner {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px;
        }
        .timer-num {
            font-family: 'DM Mono', monospace;
            font-size: 54px; font-weight: 300;
            letter-spacing: -0.03em; line-height: 1;
            transition: opacity 0.08s;
        }
        .timer-label-row {
            display: flex; align-items: center; gap: 8px;
        }
        .timer-mode {
            font-family: 'DM Mono', monospace;
            font-size: 9px; font-weight: 400;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--text3);
        }
        .session-dots { display: flex; gap: 5px; }
        .sdot { width: 5px; height: 5px; border-radius: 50%; background: var(--surface3); transition: all 0.3s ease; }
        .sdot.done { background: var(--ring); }

        /* ── CONTROLS ───────────────────────────────────────── */
        .controls { display: flex; align-items: center; gap: 14px; }

        .btn-play {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--ring);
            border: none; cursor: pointer; color: #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-play:hover { transform: scale(1.04); }
        .btn-play:active { transform: scale(0.93); }

        .btn-icon {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text2); cursor: pointer;
            transition: all 0.18s ease;
        }
        .btn-icon:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
        .btn-icon:active { transform: scale(0.88); }
        .btn-icon.danger { color: var(--danger); }
        .btn-icon.danger:hover { background: rgba(224,92,106,0.08); border-color: rgba(224,92,106,0.2); }

        /* ── PROGRESS BAR ───────────────────────────────────── */
        .progress-wrap { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .progress-track { width: 100%; height: 2px; background: var(--surface3); border-radius: 1px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--ring); border-radius: 1px; transition: width 1s linear; width: 0%; }
        .progress-meta { display: flex; justify-content: space-between; }
        .progress-meta span { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--text3); letter-spacing: 0.1em; }

        /* ── LOG PANEL ──────────────────────────────────────── */
        .log-scroll { flex: 1; overflow-y: auto; }
        .log-scroll::-webkit-scrollbar { width: 2px; }
        .log-scroll::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 1px; }

        .log-entry {
            padding: 9px 18px;
            border-bottom: 1px solid var(--border);
            animation: logIn 0.25s ease;
        }
        @keyframes logIn { from { opacity:0; } to { opacity:1; } }
        .log-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .log-tag { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text3); }
        .log-time { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--text3); }
        .log-msg { font-size: 11px; color: var(--text2); font-weight: 400; }

        /* ── AUDIO PANEL ────────────────────────────────────── */
        .audio-list { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 5px; }

        .audio-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: var(--r-sm);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text2); font-family: 'Geist', sans-serif;
            font-size: 11.5px; font-weight: 400;
            cursor: pointer; transition: all 0.18s ease; text-align: left;
        }
        .audio-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
        .audio-btn.active { background: var(--surface2); color: var(--text); border-color: var(--border2); }
        .audio-btn-icon { width: 26px; height: 26px; border-radius: 7px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; transition: background 0.18s; }
        .audio-btn.active .audio-btn-icon { background: rgba(124,111,255,0.15); }
        .audio-label { flex: 1; }
        .audio-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--surface3); transition: all 0.25s ease; flex-shrink: 0; }
        .audio-dot.on { background: var(--ring); animation: blink 2s ease infinite; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.35; } }

        /* Live stream row — distinct styling */
        .audio-btn.live-btn { border-color: rgba(224,92,106,0.15); }
        .audio-btn.live-btn:hover { border-color: rgba(224,92,106,0.3); background: rgba(224,92,106,0.05); }
        .audio-btn.live-btn.active { border-color: rgba(224,92,106,0.35); background: rgba(224,92,106,0.08); }
        .audio-btn.live-btn .audio-btn-icon { background: rgba(224,92,106,0.1); }
        .live-badge {
            font-family: 'DM Mono', monospace;
            font-size: 7px; font-weight: 500;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--live); background: rgba(224,92,106,0.12);
            border: 1px solid rgba(224,92,106,0.2);
            border-radius: 4px; padding: 1px 5px;
            flex-shrink: 0;
        }
        .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--live); flex-shrink: 0; }
        .audio-btn.live-btn.active .live-dot { animation: blink 1.2s ease infinite; }

        .vol-row { padding: 0 14px 14px; }
        .vol-label { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: var(--surface3); border-radius: 1px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: var(--text); cursor: pointer; margin-top: -8px;
            transition: background 0.2s;
        }
        input[type=range]:hover::-webkit-slider-thumb { background: var(--ring); }
        @media (max-width: 900px) {
            input[type=range]::-webkit-slider-runnable-track { height: 3px; }
            input[type=range]::-webkit-slider-thumb { height: 22px; width: 22px; margin-top: -10px; }
        }

        /* ── MOBILE MUSIC FAB ───────────────────────────────── */
        .music-fab {
            display: none;
            position: fixed; bottom: 22px; right: 18px;
            z-index: 300;
            flex-direction: column; align-items: flex-end; gap: 8px;
        }
        @media (max-width: 900px) { .music-fab { display: flex; } }

        .fab-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border2);
            box-shadow: var(--shadow-md);
            cursor: pointer; color: var(--text2);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; position: relative; flex-shrink: 0;
        }
        .fab-btn:hover { color: var(--text); border-color: var(--ring); }
        .fab-btn:active { transform: scale(0.91); }
        .fab-badge {
            position: absolute; top: 3px; right: 3px;
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--ring);
            border: 2px solid var(--bg);
            display: none;
        }
        .fab-btn.has-sound .fab-badge { display: block; }

        .music-popup {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--r-lg);
            width: 288px;
            box-shadow: var(--shadow-md);
            transform-origin: bottom right;
            transform: scale(0.9) translateY(8px);
            opacity: 0; pointer-events: none;
            transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .music-popup.open { opacity: 1; pointer-events: all; transform: scale(1) translateY(0); }

        .popup-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 11px; border-bottom: 1px solid var(--border); }
        .popup-title { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text2); }
        .popup-close { width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); border: none; color: var(--text3); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; transition: all 0.18s; }
        .popup-close:hover { background: var(--surface3); color: var(--text); }

        .popup-sounds { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 4px; }

        .popup-sound-btn {
            display: flex; align-items: center; gap: 9px;
            padding: 11px 10px; border-radius: 9px;
            background: transparent; border: 1px solid transparent;
            color: var(--text2); font-family: 'Geist', sans-serif;
            font-size: 12px; font-weight: 400;
            cursor: pointer; transition: all 0.18s ease; width: 100%;
        }
        .popup-sound-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
        .popup-sound-btn.active { background: var(--surface2); color: var(--text); border-color: var(--border2); }
        .popup-sound-icon { width: 24px; height: 24px; border-radius: 6px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
        .popup-sound-btn.active .popup-sound-icon { background: rgba(124,111,255,0.15); }
        .popup-label { flex: 1; text-align: left; }
        .popup-ind { width: 5px; height: 5px; border-radius: 50%; background: var(--surface3); flex-shrink: 0; }
        .popup-ind.on { background: var(--ring); animation: blink 2s ease infinite; }

        /* Live row in popup */
        .popup-sound-btn.live-btn { border-color: transparent; }
        .popup-sound-btn.live-btn:hover { background: rgba(224,92,106,0.06); border-color: rgba(224,92,106,0.2); }
        .popup-sound-btn.live-btn.active { background: rgba(224,92,106,0.07); border-color: rgba(224,92,106,0.25); }
        .popup-sound-btn.live-btn .popup-sound-icon { background: rgba(224,92,106,0.1); }

        .popup-vol { padding: 4px 12px 12px; }
        .popup-vol-label { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; margin-bottom: 7px; }

        /* ── SETTINGS MODAL ─────────────────────────────────── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }

        .modal-card {
            width: 100%; max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--r-xl);
            padding: 28px;
            transform: translateY(16px);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), background 0.3s ease;
            max-height: 90dvh; overflow-y: auto;
        }
        .modal-overlay.open .modal-card { transform: translateY(0); }
        .modal-card::-webkit-scrollbar { width: 2px; }
        .modal-card::-webkit-scrollbar-thumb { background: var(--surface3); }

        .modal-title {
            font-family: 'DM Mono', monospace;
            font-size: 9px; font-weight: 400;
            letter-spacing: 0.22em; text-transform: uppercase;
            text-align: center; color: var(--text3);
            margin-bottom: 24px;
        }

        .set-row { margin-bottom: 20px; }
        .set-label { display: flex; justify-content: space-between; align-items: center; font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); margin-bottom: 9px; }
        .set-val { color: var(--text2); }
        .set-divider { height: 1px; background: var(--border); margin: 4px 0 20px; }

        /* Theme switcher */
        .theme-row { display: flex; gap: 7px; }
        .theme-opt {
            flex: 1; padding: 10px 8px; border-radius: var(--r-md);
            border: 1px solid var(--border);
            font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 400;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px;
            background: var(--surface2); color: var(--text2);
            transition: all 0.2s ease;
        }
        .theme-opt:hover { border-color: var(--border2); color: var(--text); }
        .theme-prev { width: 44px; height: 22px; border-radius: 6px; flex-shrink: 0; }
        .tp-dark  { background: linear-gradient(120deg, #0d0d10 40%, #7c6fff 100%); }
        .tp-light { background: linear-gradient(120deg, #f4f3fa 40%, #7c6fff 100%); }
        .theme-opt.active { border-color: var(--ring); color: var(--text); background: rgba(124,111,255,0.07); }

        /* Swatches */
        .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
        .swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.18s ease; }
        .swatch:hover { transform: scale(1.15); }
        .swatch.active { border-color: var(--text); }

        /* Toggle */
        .toggle-row { display: flex; align-items: center; justify-content: space-between; }
        .toggle-lbl { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); }
        .sw { position: relative; display: inline-block; width: 40px; height: 22px; }
        .sw input { opacity: 0; width: 0; height: 0; }
        .sw-t { position: absolute; cursor: pointer; inset: 0; background: var(--surface3); border: 1px solid var(--border); border-radius: 11px; transition: 0.25s; }
        .sw-t::before { content: ''; position: absolute; height: 16px; width: 16px; left: 2px; bottom: 2px; background: var(--text3); border-radius: 50%; transition: 0.25s; }
        input:checked + .sw-t { background: var(--ring); border-color: var(--ring); }
        input:checked + .sw-t::before { transform: translateX(18px); background: #fff; }

        .btn-commit {
            width: 100%; padding: 13px;
            background: var(--ring); color: #fff;
            font-family: 'DM Mono', monospace;
            font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
            border: none; border-radius: var(--r-sm); cursor: pointer; margin-top: 8px;
            transition: opacity 0.18s ease, transform 0.12s ease;
        }
        .btn-commit:hover { opacity: 0.88; }
        .btn-commit:active { transform: scale(0.98); }

        .hidden { display: none !important; }

        /* Subtle noise — just 1.5% opacity */
        body::before {
            content: ''; position: fixed; inset: 0;
            pointer-events: none; z-index: 1; opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 180px 180px;
        }

        @media (max-width: 900px) {
            .side { display: none; }
            .shell { padding: 0; }

            .center {
                max-width: 100%; width: 100%;
                min-height: 100dvh; height: auto;
                border-radius: 0;
                padding: 52px 28px 40px;
                justify-content: space-between;
            }

            /* Hide deep focus — meaningless without sidebars */
            #deep-btn { display: none; }

            /* Top row: seg control centered since deep-focus is gone */
            .top-row { justify-content: center; }

            /* Bigger ring */
            .ring-wrap { width: 270px; height: 270px; margin: 28px 0 20px; }
            .timer-num { font-size: 58px; }
            .timer-mode { font-size: 11px; letter-spacing: 0.22em; }

            /* Bigger tap targets */
            .btn-play { width: 72px; height: 72px; }
            .btn-play svg { width: 26px; height: 26px; }
            .btn-icon { width: 52px; height: 52px; }
            .btn-icon svg { width: 18px; height: 18px; }
            .controls { gap: 20px; }

            /* Seg: larger tap area */
            .seg-btn { padding: 9px 22px; font-size: 12px; }

            /* Progress */
            .progress-wrap { margin-top: 24px; }
            .progress-meta span { font-size: 9.5px; }

            /* FAB bigger */
            .fab-btn { width: 56px; height: 56px; }
        }

        @media (max-width: 480px) {
            .center { padding: 44px 20px 32px; }
            .ring-wrap { width: 240px; height: 240px; margin: 22px 0 16px; }
            .timer-num { font-size: 52px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="shell">
    <!-- Left: Log -->
    <aside class="panel side">
        <div class="label">Log</div>
        <div class="log-scroll" id="log-container"></div>
    </aside>

    <!-- Center -->
    <main class="panel center">

        <div class="top-row">
            <button id="deep-btn" class="focus-pill" onclick="app.toggleDeepFocus()">
                <div class="dot"></div>Deep focus
            </button>
            <div class="seg">
                <button id="tab-work"  class="seg-btn active" onclick="app.setMode('work')">Work</button>
                <button id="tab-break" class="seg-btn"        onclick="app.setMode('break')">Break</button>
            </div>
        </div>

        <div class="ring-wrap">
            <svg class="ring-svg" viewBox="0 0 280 280">
                <circle class="ring-track" cx="140" cy="140" r="130"/>
                <circle id="timer-ring" class="ring-bar" cx="140" cy="140" r="130"/>
            </svg>
            <div class="ring-inner">
                <div id="timer-display" class="timer-num">25:00</div>
                <div class="timer-label-row">
                    <div id="mode-label" class="timer-mode">work</div>
                    <div class="session-dots" id="session-dots">
                        <div class="sdot done"></div>
                        <div class="sdot done"></div>
                        <div class="sdot"></div>
                        <div class="sdot"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-icon danger" onclick="app.reset()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <button class="btn-play" onclick="app.toggle()">
                <svg id="svg-play"  width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="svg-pause" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="btn-icon" onclick="app.openSettings()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>

        <div class="progress-wrap">
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="progress-meta">
                <span id="prog-elapsed">0:00 elapsed</span>
                <span id="prog-remain">25:00 left</span>
            </div>
        </div>

    </main>

    <!-- Right: Sounds -->
    <aside class="panel side">
        <div class="label">Sounds</div>
        <div class="audio-list" id="audio-list"></div>
        <div class="vol-row">
            <div class="vol-label"><span>Volume</span><span id="vol-display">50%</span></div>
            <input type="range" min="0" max="100" value="50" id="sidebar-vol" oninput="app.updateVol(this.value, false)">
        </div>
    </aside>
</div>

<!-- Mobile Music FAB -->
<div class="music-fab" id="music-fab">
    <div class="music-popup" id="music-popup">
        <div class="popup-header">
            <span class="popup-title">Sounds</span>
            <button class="popup-close" onclick="app.closeMusicPopup()">✕</button>
        </div>
        <div class="popup-sounds" id="popup-sounds"></div>
        <div class="popup-vol">
            <div class="popup-vol-label"><span>Volume</span><span id="pop-vol-display">50%</span></div>
            <input type="range" min="0" max="100" value="50" id="popup-vol-range" oninput="app.updateVol(this.value, true)">
        </div>
    </div>
    <button class="fab-btn" id="fab-btn" onclick="app.toggleMusicPopup()">
        <div class="fab-badge"></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
    </button>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal" onclick="if(event.target===this)app.closeSettings()">
    <div class="modal-card">
        <div class="modal-title">Settings</div>

        <div class="set-row">
            <div class="set-label"><span>Appearance</span></div>
            <div class="theme-row">
                <button class="theme-opt active" id="theme-dark"  onclick="app.setTheme('dark',this)">
                    <div class="theme-prev tp-dark"></div>Dark
                </button>
                <button class="theme-opt"        id="theme-light" onclick="app.setTheme('light',this)">
                    <div class="theme-prev tp-light"></div>Light
                </button>
            </div>
        </div>

        <div class="set-divider"></div>

        <div class="set-row">
            <div class="set-label"><span>Accent</span></div>
            <div class="swatches">
                <div class="swatch active" style="background:#7c6fff" onclick="app.setColor('#7c6fff',this)"></div>
                <div class="swatch"        style="background:#3ecf8e" onclick="app.setColor('#3ecf8e',this)"></div>
                <div class="swatch"        style="background:#e05c6a" onclick="app.setColor('#e05c6a',this)"></div>
                <div class="swatch"        style="background:#e8932a" onclick="app.setColor('#e8932a',this)"></div>
                <div class="swatch"        style="background:#3ab0d4" onclick="app.setColor('#3ab0d4',this)"></div>
                <div class="swatch"        style="background:#aaaaaa" onclick="app.setColor('#aaaaaa',this)"></div>
            </div>
        </div>

        <div class="set-divider"></div>

        <div class="set-row">
            <div class="toggle-row">
                <span class="toggle-lbl">Animations</span>
                <label class="sw">
                    <input type="checkbox" checked onchange="app.toggleAnim(this.checked)">
                    <span class="sw-t"></span>
                </label>
            </div>
        </div>

        <div class="set-row">
            <div class="set-label"><span>Work</span><span class="set-val" id="work-val">25m</span></div>
            <input type="range" min="1" max="90" value="25" oninput="app.setWork(this.value)">
        </div>

        <div class="set-row">
            <div class="set-label"><span>Break</span><span class="set-val" id="rest-val">5m</span></div>
            <input type="range" min="1" max="30" value="5" oninput="app.setRest(this.value)">
        </div>

        <button class="btn-commit" onclick="app.closeSettings()">Save</button>
    </div>
</div>

<script>
const app = (() => {
    const S = {
        workMins: 25, restMins: 5,
        timeLeft: 25*60, total: 25*60,
        running: false, mode: 'work',
        deep: false, interval: null,
        audio: { ctx: null, node: null, gain: null, type: null },
        yt: { iframe: null, playing: false },
        sessions: 0, musicOpen: false
    };

    const $ = id => document.getElementById(id);

    // Noise-based sounds
    const SOUNDS = [
        { id: 'white', label: 'White noise', icon: '◌' },
        { id: 'brown', label: 'Ocean',       icon: '≋' },
        { id: 'rain',  label: 'Rain',        icon: '⋮' },
        { id: 'cafe',  label: 'Café',        icon: '○' },
    ];

    // Live stream entry — separate treatment
    const LIVE = { id: 'lofi', label: 'Study girl · live', icon: '♪' };

    const init = () => {
        buildSidebar();
        buildPopup();
        render(true);
        log('ready', 'sys');
        document.addEventListener('click', e => {
            if (S.musicOpen && !$('music-fab').contains(e.target)) closeMusicPopup();
        });
    };

    // ── Build audio buttons ──────────────────────────────────
    const makeSideBtn = (s, isLive = false) => {
        const b = document.createElement('button');
        b.className = isLive ? 'audio-btn live-btn' : 'audio-btn';
        b.id = `abtn-${s.id}`;
        b.onclick = () => isLive ? toggleLive() : setAudio(s.id);
        if (isLive) {
            b.innerHTML = `
                <div class="audio-btn-icon">${s.icon}</div>
                <span class="audio-label">${s.label}</span>
                <span class="live-badge">live</span>
                <div class="live-dot" id="ldot-side"></div>`;
        } else {
            b.innerHTML = `
                <div class="audio-btn-icon">${s.icon}</div>
                <span class="audio-label">${s.label}</span>
                <div class="audio-dot" id="ind-${s.id}"></div>`;
        }
        return b;
    };

    const makePopupBtn = (s, isLive = false) => {
        const b = document.createElement('button');
        b.className = isLive ? 'popup-sound-btn live-btn' : 'popup-sound-btn';
        b.id = `pbtn-${s.id}`;
        b.onclick = () => isLive ? toggleLive() : setAudio(s.id);
        if (isLive) {
            b.innerHTML = `
                <div class="popup-sound-icon">${s.icon}</div>
                <span class="popup-label">${s.label}</span>
                <span class="live-badge">live</span>
                <div class="live-dot" id="ldot-pop"></div>`;
        } else {
            b.innerHTML = `
                <div class="popup-sound-icon">${s.icon}</div>
                <span class="popup-label">${s.label}</span>
                <div class="popup-ind" id="pind-${s.id}"></div>`;
        }
        return b;
    };

    const buildSidebar = () => {
        const c = $('audio-list');
        SOUNDS.forEach(s => c.appendChild(makeSideBtn(s)));
        c.appendChild(makeSideBtn(LIVE, true));
    };

    const buildPopup = () => {
        const c = $('popup-sounds');
        SOUNDS.forEach(s => c.appendChild(makePopupBtn(s)));
        c.appendChild(makePopupBtn(LIVE, true));
    };

    // ── Lofi live stream ─────────────────────────────────────
    // Uses a hidden iframe embedding the lofi girl 24/7 YouTube stream
    const LOFI_YT = 'https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=0';

    const toggleLive = () => {
        if (S.yt.playing) {
            stopLive();
        } else {
            // Stop any noise first
            if (S.audio.type) {
                S.audio.node?.disconnect();
                S.audio.type = null;
                syncSoundUI();
            }
            startLive();
        }
    };

    const startLive = () => {
        if (!S.yt.iframe) {
            const f = document.createElement('iframe');
            f.id = 'yt-frame';
            f.style.cssText = 'position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
            f.allow = 'autoplay';
            f.src = LOFI_YT;
            document.body.appendChild(f);
            S.yt.iframe = f;
        } else {
            S.yt.iframe.src = LOFI_YT;
        }
        S.yt.playing = true;
        syncLiveUI(true);
        log('lofi stream on', 'audio');
    };

    const stopLive = () => {
        if (S.yt.iframe) { S.yt.iframe.src = ''; }
        S.yt.playing = false;
        syncLiveUI(false);
        log('lofi stream off', 'audio');
    };

    const syncLiveUI = (on) => {
        ['abtn-lofi','pbtn-lofi'].forEach(id => $(`${id}`)?.classList.toggle('active', on));
        ['ldot-side','ldot-pop'].forEach(id => { const el = $(id); if(el) el.style.opacity = on ? '1' : '0.3'; });
        $('fab-btn').classList.toggle('has-sound', on || !!S.audio.type);
    };

    // ── Noise audio ──────────────────────────────────────────
    const setAudio = t => {
        // Stop live if running
        if (S.yt.playing) stopLive();

        if (!S.audio.ctx) {
            S.audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
            S.audio.gain = S.audio.ctx.createGain();
            S.audio.gain.connect(S.audio.ctx.destination);
            S.audio.gain.gain.value = 0.5;
        }
        if (S.audio.type === t) {
            S.audio.node?.disconnect(); S.audio.type = null;
        } else {
            S.audio.node?.disconnect();
            const buf = 4096;
            S.audio.node = S.audio.ctx.createScriptProcessor(buf, 1, 1);
            let l1 = 0, l2 = 0;
            S.audio.node.onaudioprocess = e => {
                const o = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < buf; i++) {
                    const w = Math.random()*2-1;
                    if      (t==='brown') { o[i]=(l1+0.02*w)/1.02; l1=o[i]; o[i]*=3.5; }
                    else if (t==='rain')  { const d=Math.random()<0.004?(Math.random()*2-1)*0.5:0; o[i]=l1*0.97+w*0.03+d; l1=o[i]; o[i]*=2; }
                    else if (t==='cafe')  { l2=l2*0.95+w*0.05; o[i]=(l2+(Math.random()<0.002?Math.sin(i*.1)*.25:0))*1.8; }
                    else                  { o[i]=w*0.1; }
                }
            };
            S.audio.node.connect(S.audio.gain);
            S.audio.type = t;
        }
        syncSoundUI();
        $('fab-btn').classList.toggle('has-sound', !!S.audio.type || S.yt.playing);
    };

    const syncSoundUI = () => {
        SOUNDS.forEach(s => {
            const a = S.audio.type === s.id;
            $(`abtn-${s.id}`)?.classList.toggle('active', a);
            $(`ind-${s.id}`)?.classList.toggle('on', a);
            $(`pbtn-${s.id}`)?.classList.toggle('active', a);
            $(`pind-${s.id}`)?.classList.toggle('on', a);
        });
    };

    // ── Timer ────────────────────────────────────────────────
    const toggle = () => {
        if (S.running) {
            clearInterval(S.interval);
            $('svg-play').classList.remove('hidden'); $('svg-pause').classList.add('hidden');
            S.running = false; log('paused', 'timer');
        } else {
            if (S.audio.ctx?.state === 'suspended') S.audio.ctx.resume();
            S.interval = setInterval(tick, 1000);
            $('svg-play').classList.add('hidden'); $('svg-pause').classList.remove('hidden');
            S.running = true; log('running', 'timer');
        }
    };

    const tick = () => { if (S.timeLeft > 0) { S.timeLeft--; render(); } else complete(); };

    const complete = () => {
        clearInterval(S.interval); S.running = false;
        $('svg-play').classList.remove('hidden'); $('svg-pause').classList.add('hidden');
        S.sessions++; updateDots(); log('session complete', 'sys');
        setTimeout(() => setMode(S.mode === 'work' ? 'break' : 'work'), 1000);
    };

    const updateDots = () => document.querySelectorAll('.sdot').forEach((d,i) => d.classList.toggle('done', i < S.sessions % 5));

    const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

    const render = (force = false) => {
        const str = fmt(S.timeLeft);
        const d = $('timer-display');
        if (d.textContent !== str || force) {
            d.style.opacity = '0.25';
            requestAnimationFrame(() => { d.textContent = str; d.style.opacity = '1'; });
        }
        const prog = 1 - S.timeLeft / S.total;
        $('timer-ring').style.strokeDashoffset = 816.81 * (1 - prog);
        $('progress-fill').style.width = `${prog * 100}%`;
        const elapsed = S.total - S.timeLeft;
        $('prog-elapsed').textContent = `${fmt(elapsed)} elapsed`;
        $('prog-remain').textContent  = `${fmt(S.timeLeft)} left`;
    };

    const reset = () => {
        clearInterval(S.interval); S.running = false; S.timeLeft = S.total;
        $('svg-play').classList.remove('hidden'); $('svg-pause').classList.add('hidden');
        render(true); log('reset', 'user');
    };

    const setMode = m => {
        S.mode = m; S.total = (m === 'work' ? S.workMins : S.restMins) * 60;
        $('tab-work').classList.toggle('active', m === 'work');
        $('tab-break').classList.toggle('active', m === 'break');
        $('mode-label').textContent = m;
        log(`→ ${m}`, 'sys'); reset();
    };

    const toggleDeepFocus = () => {
        S.deep = !S.deep;
        document.body.classList.toggle('deep-focus', S.deep);
        $('deep-btn').classList.toggle('active', S.deep);
        log(`focus ${S.deep ? 'on' : 'off'}`, 'ui');
    };

    const setTheme = (theme, el) => {
        document.body.classList.toggle('light', theme === 'light');
        document.querySelectorAll('.theme-opt').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        log(`theme: ${theme}`, 'ui');
    };

    const setColor = (hex, el) => {
        document.documentElement.style.setProperty('--ring', hex);
        document.documentElement.style.setProperty('--accent', hex);
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        log(`accent: ${hex}`, 'ui');
    };

    const log = (msg, tag) => {
        const c = $('log-container');
        const t = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const el = document.createElement('div');
        el.className = 'log-entry';
        el.innerHTML = `<div class="log-row"><span class="log-tag">${tag}</span><span class="log-time">${t}</span></div><div class="log-msg">${msg}</div>`;
        c.prepend(el);
        if (c.children.length > 14) c.lastChild.remove();
    };

    const updateVol = (v, fromPopup) => {
        if (S.audio.gain) S.audio.gain.gain.value = v / 100;
        $('vol-display').textContent = `${v}%`;
        $('pop-vol-display').textContent = `${v}%`;
        (fromPopup ? $('sidebar-vol') : $('popup-vol-range')).value = v;
    };

    const toggleAnim = on => {
        $('timer-ring').style.transition = on
            ? 'stroke-dashoffset 0.9s cubic-bezier(0.4,0,0.2,1), stroke 0.35s ease'
            : 'none';
    };

    const setWork = v => { S.workMins=+v; $('work-val').textContent=v+'m'; if(!S.running&&S.mode==='work'){S.total=v*60;S.timeLeft=S.total;render(true);} };
    const setRest = v => { S.restMins=+v; $('rest-val').textContent=v+'m'; if(!S.running&&S.mode==='break'){S.total=v*60;S.timeLeft=S.total;render(true);} };

    const openSettings = () => $('settings-modal').classList.add('open');
    const closeSettings = () => $('settings-modal').classList.remove('open');

    const toggleMusicPopup = () => { S.musicOpen = !S.musicOpen; $('music-popup').classList.toggle('open', S.musicOpen); };
    const closeMusicPopup  = () => { S.musicOpen = false; $('music-popup').classList.remove('open'); };

    return { init, toggle, reset, setMode, toggleDeepFocus, setTheme, setColor, updateVol, toggleAnim, setWork, setRest, openSettings, closeSettings, toggleMusicPopup, closeMusicPopup };
})();

window.addEventListener('load', app.init);
</script>
</body>
</html>
