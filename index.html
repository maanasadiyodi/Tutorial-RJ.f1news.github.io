<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>SwissDrop · Ephemeral Secure Transfer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c10;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      color: #e8edf5;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" stitchTiles="stitch"/></filter><rect width="200" height="200" filter="url(%23noise)" opacity="0.03"/></svg>');
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      background: rgba(18, 22, 28, 0.96);
      border-radius: 32px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(64, 128, 128, 0.15);
      overflow: hidden;
      border: 1px solid rgba(64, 128, 128, 0.25);
    }

    .card-pane {
      padding: 1.75rem;
    }

    @media (max-width: 640px) {
      .card-pane {
        padding: 1.25rem;
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(64, 128, 128, 0.3);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c0d4e8, #7a9cbb);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo i {
      background: none;
      color: #7a9cbb;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
      font-weight: 500;
      background: #11161c;
      padding: 0.3rem 1rem 0.3rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #2a2f38;
      flex-wrap: wrap;
    }

    .role-tag {
      background: #1a2a2a;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #7ab3c8;
    }

    button {
      background: #1e232b;
      border: 1px solid #373e48;
      color: #e0e6f0;
      padding: 0.45rem 1.2rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      border-radius: 40px;
    }

    button:hover {
      background: #2c323c;
      border-color: #5f8a9c;
      transform: translateY(-1px);
    }

    button.primary {
      background: #2c5a6e;
      border-color: #3a6d84;
      color: white;
      box-shadow: 0 2px 8px rgba(44, 90, 110, 0.2);
    }

    button.primary:hover {
      background: #234a5c;
    }

    button.danger {
      background: #6e2c2c;
      border-color: #843a3a;
      color: white;
    }

    button.danger:hover {
      background: #5a2323;
    }

    button.outline {
      background: transparent;
      border-color: #3a6d84;
      color: #8ab3c7;
    }

    button.outline:hover {
      background: #1a2a30;
      border-color: #5f8a9c;
    }

    button.icon-btn {
      padding: 0.4rem 0.8rem;
      background: #1e232b;
      border-color: #3a4548;
    }

    button.icon-btn:hover {
      background: #2c5a6e;
      border-color: #5f8a9c;
    }

    button:disabled {
      opacity: 0.5;
      transform: none;
      cursor: not-allowed;
    }

    .notice {
      background: #1a2428;
      border-left: 3px solid #5f8a9c;
      padding: 0.7rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #bdd4e0;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .drop-zone {
      border: 2px dashed #3a4548;
      border-radius: 28px;
      padding: 2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #101318;
      margin-bottom: 1rem;
    }

    .drop-zone:hover {
      border-color: #5f8a9c;
      background: #181d24;
    }

    .drop-zone i {
      font-size: 2.2rem;
      color: #7a9cbb;
      margin-bottom: 0.5rem;
    }

    .file-input {
      display: none;
    }

    .selected-files-container {
      margin-top: 1rem;
      max-height: 180px;
      overflow-y: auto;
    }

    .selected-file-item {
      background: #1a1f26;
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .remove-file-btn {
      background: none;
      border: none;
      color: #c08a7a;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
    }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0.5rem 0 1.5rem 0;
      background: #11161c;
      padding: 0.75rem 1rem;
      border-radius: 48px;
      flex-wrap: wrap;
    }

    .progress-wrapper {
      margin-top: 0.8rem;
      width: 100%;
      display: none;
      align-items: center;
      gap: 12px;
      background: #1a1f26;
      padding: 0.5rem 0.8rem;
      border-radius: 60px;
    }
    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: #2d2f36;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5f8a9c, #8ab3c7);
      border-radius: 10px;
      transition: width 0.1s linear;
    }
    .progress-text {
      font-size: 0.7rem;
      font-weight: 600;
      color: #8ab3c7;
      font-family: monospace;
    }

    .files-header {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bcc7d4;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    /* Selection toolbar - ALWAYS VISIBLE */
    .selection-toolbar {
      background: #1a2428;
      border-radius: 60px;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #2a3a3a;
    }

    .selection-toolbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .selection-count {
      font-size: 0.85rem;
      font-weight: 600;
      color: #8ab3c7;
      background: #0e131a;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
    }

    .selection-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    /* Custom checkbox */
    .custom-checkbox {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 20px;
      height: 20px;
    }
    
    .custom-checkbox input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      width: 0;
      height: 0;
    }
    
    .checkmark {
      position: relative;
      display: inline-block;
      width: 20px;
      height: 20px;
      background: #1a1f26;
      border: 2px solid #3a4548;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .custom-checkbox:hover .checkmark {
      border-color: #5f8a9c;
      background: #222833;
    }
    
    .custom-checkbox input:checked ~ .checkmark {
      background: #2c5a6e;
      border-color: #5f8a9c;
    }
    
    .custom-checkbox .checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    
    .custom-checkbox input:checked ~ .checkmark:after {
      display: block;
    }

    /* File list */
    .files-list {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .files-list::-webkit-scrollbar {
      width: 6px;
    }
    .files-list::-webkit-scrollbar-track {
      background: #1a1f26;
      border-radius: 10px;
    }
    .files-list::-webkit-scrollbar-thumb {
      background: #3a4548;
      border-radius: 10px;
    }

    .file-card {
      background: #12171f;
      border: 1px solid #252c34;
      border-radius: 20px;
      margin-bottom: 0.75rem;
      padding: 0.9rem 1rem;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .file-card:hover {
      border-color: #5f8a9c;
      background: #161d26;
    }

    .file-card.selected {
      border-color: #5f8a9c;
      background: #1a2a30;
    }

    .file-info {
      flex: 1;
      min-width: 150px;
    }

    .file-name {
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-meta {
      font-size: 0.7rem;
      color: #8f9eb2;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .expiry {
      color: #c0a06b;
      background: #1e241a;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      font-weight: 600;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .empty-message {
      text-align: center;
      padding: 2rem;
      color: #6c7a8e;
      background: #0e131a;
      border-radius: 40px;
      border: 1px dashed #2d3440;
    }

    /* Stats container */
    .stats-container {
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid #252c34;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.7rem;
      color: #7e8c9e;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #11161c;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid #252c34;
    }

    .stat-item i {
      color: #7a9cbb;
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      .stat-item {
        padding: 0.3rem 0.8rem;
        font-size: 0.65rem;
      }
      .file-card {
        padding: 0.8rem;
      }
      .selection-toolbar {
        padding: 0.5rem 1rem;
      }
      button {
        padding: 0.4rem 1rem;
      }
      .selection-count {
        font-size: 0.75rem;
        padding: 0.2rem 0.7rem;
      }
      .file-actions {
        width: 100%;
        justify-content: flex-start;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  (function() {
    const DB_NAME = 'SwissDropDB';
    const DB_VERSION = 7;
    const STORE_NAME = 'files';
    const USER_KEY = 'swissdrop_user';
    const MAX_MB = 100;
    const MAX_BYTES = MAX_MB * 1024 * 1024;
    const LIFETIME = 4 * 60 * 60 * 1000;
    const GUEST_LIMIT = 5;

    let db = null;
    let currentUser = null;
    let selectedFilesToUpload = [];
    let selectedFileIds = new Set();
    let isUploading = false;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('userId', 'userId', { unique: false });
            store.createIndex('created', 'created', { unique: false });
            store.createIndex('shareId', 'shareId', { unique: false });
          }
        };
      });
    }

    async function saveFileToDB(fileData) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.add(fileData);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error);
      });
    }

    async function getUserFiles(userId) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const index = store.index('userId');
        const request = index.getAll(userId);
        request.onsuccess = () => {
          const files = request.result || [];
          const now = Date.now();
          const validFiles = files.filter(f => now - f.created < LIFETIME);
          if (validFiles.length !== files.length) {
            const deleteTransaction = db.transaction([STORE_NAME], 'readwrite');
            const deleteStore = deleteTransaction.objectStore(STORE_NAME);
            files.forEach(f => {
              if (now - f.created >= LIFETIME) deleteStore.delete(f.id);
            });
          }
          resolve(validFiles);
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function getFileFromDB(fileId) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(fileId);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteFileFromDB(fileId) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(fileId);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteMultipleFiles(fileIds) {
      let count = 0;
      for (const fileId of fileIds) {
        try { await deleteFileFromDB(fileId); count++; } catch (err) {}
      }
      return count;
    }

    async function updateFileInDB(fileData) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put(fileData);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error);
      });
    }

    async function getFilesByShareId(shareId) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const index = store.index('shareId');
        const request = index.getAll(shareId);
        request.onsuccess = () => {
          const files = request.result || [];
          const now = Date.now();
          resolve(files.filter(f => now - f.created < LIFETIME));
        };
        request.onerror = () => reject(request.error);
      });
    }

    function generateUserId(name) {
      return 'user_' + name.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + btoa(name).substring(0, 8);
    }

    function loadUser() {
      try {
        const raw = localStorage.getItem(USER_KEY);
        if (raw) {
          currentUser = JSON.parse(raw);
          if (!currentUser.id) {
            currentUser.id = generateUserId(currentUser.name);
            saveUser();
          }
        } else {
          const guestId = 'guest_' + Math.random().toString(36).substring(2, 10);
          currentUser = { name: 'guest', role: 'guest', id: guestId, createdAt: Date.now() };
          saveUser();
        }
      } catch { 
        currentUser = null; 
      }
      if (!currentUser || !currentUser.name) {
        const guestId = 'guest_' + Math.random().toString(36).substring(2, 10);
        currentUser = { name: 'guest', role: 'guest', id: guestId, createdAt: Date.now() };
        saveUser();
      }
    }

    function saveUser() {
      localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
    }

    function isGuest() {
      return currentUser.role === 'guest';
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    function showToast(msg, isError = false) {
      let toast = document.getElementById('swissToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'swissToast';
        toast.style.position = 'fixed';
        toast.style.bottom = '24px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = '#2c5a6e';
        toast.style.color = '#e8edf5';
        toast.style.padding = '0.6rem 1.4rem';
        toast.style.borderRadius = '60px';
        toast.style.fontSize = '0.8rem';
        toast.style.fontWeight = '500';
        toast.style.zIndex = '9999';
        toast.style.backdropFilter = 'blur(6px)';
        toast.style.boxShadow = '0 10px 20px rgba(0,0,0,0.3)';
        document.body.appendChild(toast);
      }
      toast.style.backgroundColor = isError ? '#8b3a3a' : '#2c5a6e';
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2500);
      setTimeout(() => { toast.style.backgroundColor = '#2c5a6e'; }, 3000);
    }

    function updateProgress(percent, message) {
      const wrapper = document.getElementById('progressWrapper');
      const fill = document.getElementById('progressFill');
      const percentSpan = document.getElementById('progressPercent');
      const msgSpan = document.getElementById('progressMessage');
      if (wrapper) wrapper.style.display = 'flex';
      if (fill) fill.style.width = `${percent}%`;
      if (percentSpan) percentSpan.textContent = `${Math.floor(percent)}%`;
      if (msgSpan) msgSpan.textContent = message || `Uploading... ${Math.floor(percent)}%`;
    }
    
    function resetProgressUI() {
      const wrapper = document.getElementById('progressWrapper');
      if (wrapper) wrapper.style.display = 'none';
    }

    function uploadSingleFileWithProgress(fileObj, onProgress) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => { if (onProgress) onProgress(100); resolve(e.target.result); };
        reader.onerror = (err) => reject(err);
        let progress = 0;
        const interval = setInterval(() => {
          if (progress < 90) { progress += 10; if (onProgress) onProgress(progress); }
        }, 200);
        reader.onloadend = () => { clearInterval(interval); if (onProgress) onProgress(100); };
        reader.readAsDataURL(fileObj);
      });
    }

    async function uploadMultipleFiles(filesToUpload) {
      const uploaded = [];
      for (let i = 0; i < filesToUpload.length; i++) {
        const file = filesToUpload[i];
        updateProgress((i / filesToUpload.length) * 100, `Uploading ${i+1}/${filesToUpload.length}: ${file.name}`);
        try {
          const dataUrl = await uploadSingleFileWithProgress(file, (p) => {
            const overall = ((i + (p / 100)) / filesToUpload.length) * 100;
            updateProgress(overall, `Uploading ${i+1}/${filesToUpload.length}: ${file.name} (${p}%)`);
          });
          const newFile = {
            id: 'f_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15) + '_' + i,
            name: file.name,
            size: file.size,
            type: file.type,
            data: dataUrl,
            created: Date.now(),
            userId: currentUser.id,
            userName: currentUser.name,
          };
          await saveFileToDB(newFile);
          uploaded.push(newFile);
        } catch (err) {
          console.error(err);
          showToast(`Failed: ${file.name}`, true);
        }
      }
      return uploaded;
    }

    async function handleUpload() {
      if (selectedFilesToUpload.length === 0) { showToast('Select files first'); return; }
      const existing = await getUserFiles(currentUser.id);
      if (isGuest() && existing.length + selectedFilesToUpload.length > GUEST_LIMIT) {
        showToast(`Guest limit: ${GUEST_LIMIT} files max`, true);
        return;
      }
      for (const f of selectedFilesToUpload) {
        if (f.size > MAX_BYTES) { showToast(`${f.name} > ${MAX_MB}MB`, true); return; }
      }
      isUploading = true;
      const btn = document.getElementById('uploadButton');
      if (btn) btn.disabled = true;
      updateProgress(0, 'Starting...');
      try {
        const uploaded = await uploadMultipleFiles(selectedFilesToUpload);
        selectedFilesToUpload = [];
        selectedFileIds.clear();
        const fileInput = document.getElementById('fileInput');
        if (fileInput) fileInput.value = '';
        await renderMainApp();
        showToast(`✓ Uploaded ${uploaded.length} file(s)`);
        resetProgressUI();
      } catch (err) {
        showToast('Upload failed', true);
        resetProgressUI();
      } finally {
        isUploading = false;
        await renderMainApp();
      }
    }

    function removeSelectedUpload(index) {
      selectedFilesToUpload.splice(index, 1);
      renderMainApp();
    }

    function addFiles(newFiles) {
      for (const f of newFiles) {
        if (f.size <= MAX_BYTES) selectedFilesToUpload.push(f);
        else showToast(`${f.name} exceeds ${MAX_MB}MB`, true);
      }
      renderMainApp();
    }

    async function createShareLink(fileIds, isSingle = false) {
      const shareId = 'share_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
      for (const id of fileIds) {
        const file = await getFileFromDB(id);
        if (file) { file.shareId = shareId; await updateFileInDB(file); }
      }
      const link = `${location.origin}${location.pathname}?share=${shareId}`;
      if (isSingle) {
        navigator.clipboard.writeText(link).then(() => showToast(`✓ Share link copied for 1 file`));
      }
      return link;
    }

    async function shareSingleFile(fileId) {
      const link = await createShareLink([fileId], true);
      return link;
    }

    async function deleteSelectedFiles() {
      const ids = Array.from(selectedFileIds);
      if (ids.length === 0) { showToast('No files selected'); return; }
      if (confirm(`Delete ${ids.length} file(s) permanently?`)) {
        const deleted = await deleteMultipleFiles(ids);
        selectedFileIds.clear();
        await renderMainApp();
        showToast(`✓ Deleted ${deleted} file(s)`);
      }
    }

    async function shareSelectedFiles() {
      const ids = Array.from(selectedFileIds);
      if (ids.length === 0) { showToast('No files selected'); return; }
      const link = await createShareLink(ids);
      navigator.clipboard.writeText(link).then(() => showToast(`✓ Share link copied (${ids.length} files)`));
    }

    function selectAllFiles() {
      const checkboxes = document.querySelectorAll('.file-checkbox-input');
      const fileIds = Array.from(checkboxes).map(cb => cb.dataset.fileId);
      fileIds.forEach(id => selectedFileIds.add(id));
      updateSelectionUI();
    }

    function clearSelection() {
      selectedFileIds.clear();
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const countSpan = document.getElementById('selectionCount');
      const shareBtn = document.getElementById('shareSelectedBtn');
      const delBtn = document.getElementById('deleteSelectedBtn');
      const clearSelBtn = document.getElementById('clearSelectionBtn');
      const count = selectedFileIds.size;
      
      if (countSpan) countSpan.textContent = `${count} file${count !== 1 ? 's' : ''} selected`;
      if (shareBtn) shareBtn.disabled = count === 0;
      if (delBtn) delBtn.disabled = count === 0;
      if (clearSelBtn) clearSelBtn.disabled = count === 0;
      
      document.querySelectorAll('.file-checkbox-input').forEach(cb => {
        const fid = cb.dataset.fileId;
        const isChecked = selectedFileIds.has(fid);
        cb.checked = isChecked;
        const card = cb.closest('.file-card');
        if (card) card.classList.toggle('selected', isChecked);
      });
    }

    async function renderDownloadPage(shareId) {
      const shared = await getFilesByShareId(shareId);
      if (shared.length === 0) {
        document.getElementById('app').innerHTML = `<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;"><div style="background:#1a1f2a;padding:2rem;border-radius:32px;text-align:center;"><i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#c0a06b;"></i><h2 style="margin:1rem 0">Share Not Found</h2><a href="/" style="color:#7ab3c8;">← Back</a></div></div>`;
        return;
      }
      const totalSize = shared.reduce((s, f) => s + f.size, 0);
      let filesHtml = '';
      for (const f of shared) {
        const isImage = f.type?.startsWith('image/');
        const isVideo = f.type?.startsWith('video/');
        filesHtml += `
          <div class="file-card">
            <div class="file-info">
              <div class="file-name"><i class="fas ${isImage ? 'fa-image' : isVideo ? 'fa-video' : 'fa-file'}"></i>${escapeHtml(f.name)}</div>
              <div class="file-meta"><span>${formatBytes(f.size)}</span></div>
              ${(isImage || isVideo) ? `<div style="margin-top:0.8rem;background:#0e131a;border-radius:16px;padding:1rem;text-align:center;">${isImage ? `<img src="${f.data}" style="max-width:100%;max-height:180px;border-radius:8px;">` : isVideo ? `<video controls style="max-width:100%;max-height:180px;"><source src="${f.data}"></video>` : ''}</div>` : ''}
            </div>
            <div><button class="download-single" data-id="${f.id}" style="background:#2c5a6e;padding:0.5rem 1rem;"><i class="fas fa-download"></i> Download</button></div>
          </div>`;
      }
      document.getElementById('app').innerHTML = `
        <div style="display:flex;justify-content:center;min-height:100vh;padding:1.5rem;">
          <div style="max-width:800px;width:100%;background:#12171f;border-radius:32px;padding:2rem;">
            <div style="display:flex;justify-content:space-between;margin-bottom:1.5rem;"><div><i class="fas fa-cloud-upload-alt" style="color:#7a9cbb;font-size:1.5rem;"></i><span style="font-weight:700;margin-left:0.5rem;">SwissDrop</span></div></div>
            <div style="text-align:center;margin:1rem 0"><i class="fas fa-folder-open" style="font-size:2.5rem;color:#7ab3c8;"></i><h2>Shared Files</h2><p style="color:#8f9eb2">${shared.length} file(s) · ${formatBytes(totalSize)}</p></div>
            ${filesHtml}
            <div style="display:flex;gap:1rem;justify-content:center;margin-top:2rem;"><button id="downloadAllBtn" style="background:#2c5a6e;padding:0.8rem 2rem;">Download All</button><a href="/" style="background:#1e232b;padding:0.8rem 2rem;border-radius:40px;text-decoration:none;">Back</a></div>
          </div>
        </div>`;
      document.querySelectorAll('.download-single').forEach(btn => {
        btn.onclick = async () => {
          const file = await getFileFromDB(btn.dataset.id);
          if (file && Date.now() - file.created < LIFETIME) { const a = document.createElement('a'); a.href = file.data; a.download = file.name; a.click(); }
          else showToast('File expired', true);
        };
      });
      const allBtn = document.getElementById('downloadAllBtn');
      if (allBtn) allBtn.onclick = () => shared.forEach(f => { const a = document.createElement('a'); a.href = f.data; a.download = f.name; a.click(); setTimeout(()=>{}, 200); });
    }

    async function renderMainApp() {
      const userFiles = await getUserFiles(currentUser.id);
      const totalFiles = userFiles.length;
      const remaining = isGuest() ? Math.max(0, GUEST_LIMIT - totalFiles) : Infinity;
      const uploadPreview = selectedFilesToUpload.map((f, idx) => `<div class="selected-file-item"><span><i class="fas fa-file"></i> ${escapeHtml(f.name)} (${formatBytes(f.size)})</span><button class="remove-file-btn" data-idx="${idx}"><i class="fas fa-times"></i></button></div>`).join('');
      
      const filesHtml = userFiles.length === 0 ? '<div class="empty-message"><i class="fas fa-inbox"></i> No files — upload to share</div>' : userFiles.map(f => {
        const mins = Math.max(0, Math.floor((f.created + LIFETIME - Date.now()) / 60000));
        return `<div class="file-card">
          <label class="custom-checkbox">
            <input type="checkbox" class="file-checkbox-input" data-file-id="${f.id}">
            <span class="checkmark"></span>
          </label>
          <div class="file-info">
            <div class="file-name"><i class="fas fa-file"></i> ${escapeHtml(f.name)}</div>
            <div class="file-meta"><span>${formatBytes(f.size)}</span><span class="expiry"><i class="far fa-clock"></i> ${mins} min</span></div>
          </div>
          <div class="file-actions">
            <button class="share-single-btn icon-btn" data-id="${f.id}" title="Share this file"><i class="fas fa-share-alt"></i> Share</button>
            <button class="single-delete-btn icon-btn" data-id="${f.id}" title="Delete this file"><i class="fas fa-trash-alt"></i> Delete</button>
          </div>
        </div>`;
      }).join('');
      
      const mainHtml = `
        <div class="container">
          <div class="card-pane">
            <div class="header">
              <div class="logo"><i class="fas fa-cloud-upload-alt"></i> SwissDrop</div>
              <div class="user-area"><i class="fas fa-user-astronaut"></i><span>${escapeHtml(currentUser.name)}</span><span class="role-tag">${isGuest() ? `guest (${totalFiles}/${GUEST_LIMIT})` : 'pro'}</span><button id="authButton" class="primary"><i class="fas fa-key"></i> ${isGuest() ? 'login' : 'logout'}</button></div>
            </div>
            <div id="guestNotice" class="notice" style="display:${isGuest() ? 'flex' : 'none'}"><i class="fas fa-info-circle"></i> Guest mode · max ${GUEST_LIMIT} files · persistent storage</div>
            <div class="drop-zone" id="dropZone"><i class="fas fa-cloud-upload-alt"></i><p>drag & drop or click to select</p><p style="font-size:0.7rem;color:#8f9eb2;">max ${MAX_MB} MB per file · ${isGuest() ? remaining + ' slots left' : 'unlimited'}</p>${uploadPreview ? `<div class="selected-files-container">${uploadPreview}</div>` : ''}<div id="progressWrapper" class="progress-wrapper" style="display:none;"><div class="progress-bar-bg"><div id="progressFill" class="progress-fill"></div></div><div style="flex:1;font-size:0.7rem;"><span id="progressMessage"></span></div><span id="progressPercent" class="progress-text">0%</span></div></div>
            <input type="file" id="fileInput" class="file-input" multiple>
            <div class="upload-row"><button id="uploadButton" class="primary" ${selectedFilesToUpload.length === 0 || isUploading ? 'disabled' : ''}><i class="fas fa-cloud-upload-alt"></i> Upload ${selectedFilesToUpload.length} file(s)</button><button id="clearFilesBtn" ${selectedFilesToUpload.length === 0 ? 'disabled' : ''}><i class="fas fa-trash-alt"></i> Clear</button></div>
            
            <div class="files-header"><span><i class="fas fa-database"></i> Your Files</span></div>
            
            <!-- Selection Toolbar - ALWAYS VISIBLE -->
            <div class="selection-toolbar">
              <div class="selection-toolbar-left">
                <button id="selectAllBtn" class="primary" style="background:#2c5a6e;"><i class="fas fa-check-double"></i> Select All</button>
                <span class="selection-count" id="selectionCount">0 selected</span>
              </div>
              <div class="selection-actions">
                <button id="shareSelectedBtn" class="primary" disabled><i class="fas fa-share-alt"></i> Share</button>
                <button id="deleteSelectedBtn" class="danger" disabled><i class="fas fa-trash-alt"></i> Delete</button>
                <button id="clearSelectionBtn" class="outline" disabled><i class="fas fa-times"></i> Clear</button>
              </div>
            </div>
            
            <div class="files-list" id="filesContainer">${filesHtml}</div>
            
            <div class="stats-container">
              <div class="stat-item"><i class="fas fa-weight-hanging"></i> ${MAX_MB} MB max</div>
              <div class="stat-item"><i class="fas fa-hourglass-half"></i> 4h auto-delete</div>
              <div class="stat-item"><i class="fas fa-layer-group"></i> Multi-file</div>
              <div class="stat-item"><i class="fas fa-database"></i> Persistent</div>
            </div>
          </div>
        </div>`;
      
      document.getElementById('app').innerHTML = mainHtml;
      attachEvents(userFiles);
    }

    function attachEvents(userFiles) {
      // Individual file checkboxes
      document.querySelectorAll('.file-checkbox-input').forEach(cb => {
        cb.onchange = () => {
          const fid = cb.dataset.fileId;
          if (cb.checked) selectedFileIds.add(fid);
          else selectedFileIds.delete(fid);
          updateSelectionUI();
        };
      });
      
      // Single delete buttons
      document.querySelectorAll('.single-delete-btn').forEach(btn => {
        btn.onclick = async () => {
          if (confirm('Delete this file permanently?')) {
            await deleteFileFromDB(btn.dataset.id);
            selectedFileIds.delete(btn.dataset.id);
            await renderMainApp();
            showToast('File deleted');
          }
        };
      });
      
      // Single share buttons - NEW: individual file sharing
      document.querySelectorAll('.share-single-btn').forEach(btn => {
        btn.onclick = async () => {
          const fileId = btn.dataset.id;
          await shareSingleFile(fileId);
        };
      });
      
      // Selection toolbar buttons
      const selectAllBtn = document.getElementById('selectAllBtn');
      const shareBtn = document.getElementById('shareSelectedBtn');
      const deleteBtn = document.getElementById('deleteSelectedBtn');
      const clearBtn = document.getElementById('clearSelectionBtn');
      
      if (selectAllBtn) selectAllBtn.onclick = () => selectAllFiles();
      if (shareBtn) shareBtn.onclick = shareSelectedFiles;
      if (deleteBtn) deleteBtn.onclick = deleteSelectedFiles;
      if (clearBtn) clearBtn.onclick = clearSelection;
      
      // Drag & drop
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      if (dropZone) {
        dropZone.onclick = () => fileInput?.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = '#5f8a9c'; };
        dropZone.ondragleave = () => { dropZone.style.borderColor = '#3a4548'; };
        dropZone.ondrop = (e) => {
          e.preventDefault();
          dropZone.style.borderColor = '#3a4548';
          if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
        };
      }
      
      if (fileInput) {
        fileInput.onchange = (e) => { if (e.target.files.length) addFiles(Array.from(e.target.files)); e.target.value = ''; };
      }
      
      document.getElementById('uploadButton')?.addEventListener('click', handleUpload);
      document.getElementById('clearFilesBtn')?.addEventListener('click', () => { selectedFilesToUpload = []; renderMainApp(); });
      
      document.getElementById('authButton')?.addEventListener('click', async () => {
        if (isGuest()) {
          const name = prompt('Enter username (pro mode, unlimited files)');
          if (name?.trim()) {
            currentUser = { name: name.trim(), role: 'authenticated', id: generateUserId(name.trim()), createdAt: Date.now() };
            saveUser();
            selectedFileIds.clear();
            await renderMainApp();
            showToast(`Welcome ${currentUser.name} — unlimited storage!`);
          }
        } else {
          const guestId = 'guest_' + Math.random().toString(36).substring(2, 10);
          currentUser = { name: 'guest', role: 'guest', id: guestId, createdAt: Date.now() };
          saveUser();
          selectedFileIds.clear();
          await renderMainApp();
          showToast('Switched to guest mode');
        }
      });
      
      document.querySelectorAll('.remove-file-btn').forEach(btn => {
        btn.onclick = () => { removeSelectedUpload(parseInt(btn.dataset.idx)); };
      });
      
      updateSelectionUI();
    }

    async function handleRouting() {
      const share = new URLSearchParams(location.search).get('share');
      if (share) { await renderDownloadPage(share); return true; }
      return false;
    }

    async function init() {
      await initDB();
      loadUser();
      if (!await handleRouting()) await renderMainApp();
      setInterval(async () => { if (!location.search.includes('share')) await renderMainApp(); }, 60000);
    }
    init();
  })();
</script>
</body>
</html>
